name: zonai_web
description: Zonai web application (Jaspr).
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  collection: ^1.19.0
  revali_client: ^3.0.0
  jaspr: ^0.24.0-beta.1
  jaspr_riverpod: ^0.5.0-beta-0
  path: ^1.9.1
  revali_router: ^5.1.2
  riverpod: 3.3.2
  universal_web: ^1.1.1
  scoped_deps: ^0.2.1
  # Allowlist-validates developer-supplied `iconSvg` (OAuthProviderIcon rung
  # 2) before it reaches the DOM. Already resolves in the workspace lock via
  # a transitive dep, so this adds no new fetch.
  xml: ^7.0.1
  # Keep in sync with raindrop_sqlite — OpenDynamicLibrary was removed in 3.x.
  sqlite3: ">=2.4.0 <3.0.0"
  zonai_schema:
    path: ../../libs/zonai_schema
  zonai_client:
    path: ../../libs/zonai_client
  zonai:
    path: ../zonai
  jaspr_router: ^0.10.0-beta.1
  opal: ^0.2.3

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.11
  jaspr_builder: ^0.24.0-beta.1
  jaspr_cli: ^0.24.0-beta.1
  # Pinned exact, not ^: jaspr_test locks 1:1 to a jaspr version. jaspr is on
  # the 0.24 beta line because Dart 3.14 needs build_web_compilers >=4.8.11,
  # which needs analyzer >=13.3, and only jaspr_builder 0.24 allows that.
  jaspr_test: 0.24.0-beta.1
  lints: ^5.0.0
  test: ^1.25.0

jaspr:
  mode: server
  # Revali dev server uses 8080; Jaspr SSR binds this port while the CLI proxy stays on 5567.
  port: 8091
