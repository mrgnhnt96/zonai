name: zonai_web
description: Zonai web application (Jaspr).
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  client:
    path: ../server/.revali/revali_client
  revali_client: ^2.0.4
  jaspr: ^0.23.1
  jaspr_riverpod: ^0.4.5
  universal_web: ^1.1.1
  scoped_deps:
    path: ../../libs/scoped_deps
  sqlite3: ^2.9.4
  zonai_schema:
    path: ../../libs/zonai_schema
  zonai:
    path: ../zonai

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.5.1
  jaspr_builder: ^0.23.1
  jaspr_cli: ^0.23.1
  lints: ^5.0.0

jaspr:
  mode: server
  # Revali dev server uses 8080; Jaspr SSR binds this port while the CLI proxy stays on 5567.
  port: 8091
