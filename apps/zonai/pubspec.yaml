name: zonai
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  archive: ^4.0.7
  nocterm: ^0.8.0
  argon2: ^1.0.1
  async: ^2.13.1
  clock: ^1.1.2
  crypto: ^3.0.7
  ffi: ^2.1.0
  file: ">=6.0.0 <8.0.0"
  http: ^1.6.0
  jaspr: ^0.23.1
  jose: ^0.3.5
  mailer: ^7.1.0
  meta: ^1.17.0
  mustache_template: ^2.0.4
  path: ^1.9.1
  pub_semver: ^2.2.0
  raindrop_cli:
    path: ../../libs/raindrop/packages/raindrop_cli
  resqlite:
    path: ../../libs/resqlite
  revali_router: ^5.1.2
  revali_swagger_annotations: ^1.0.0
  scoped_deps: ^0.2.1
  # <3.0.0: ResqliteDelegate needs `open.overrideForAll` to point
  # package:sqlite3 at resqlite's already-loaded library. 3.x removed it, and
  # `source: process` is not a substitute -- it binds in load order, and on
  # macOS Apple's libsqlite3 is already loaded before main(). See
  # resqlite_delegate.dart's comment block.
  sqlite3: ">=2.4.0 <3.0.0"
  watcher: ^1.2.1
  yaml: ^3.1.0
  yaml_edit: ^2.2.4
  zonai_logger:
    path: ../../libs/zonai_logger
  zonai_schema:
    path: ../../libs/zonai_schema
  zonai_web:
    path: ../web
  http2: ^2.3.1

dev_dependencies:
  fake_async: ^1.3.1
  test: ^1.26.0

executables:
  zonai:
