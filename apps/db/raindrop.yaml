# Required so the CLI knows the SQL dialect.
dialect: sqlite

# Schema sources used by `dart run raindrop_cli:raindrop generate`.
schemas: lib/schemas

# Generated SQL migrations and journal metadata.
out: migrations
migration_naming: timestamp

# Omit `dart:` to skip generating lib/database/migrations.dart; the app loads
# `migrations/*.sql` from disk at runtime (see `loadMigrationsFromDirectory`).
