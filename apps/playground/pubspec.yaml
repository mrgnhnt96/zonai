name: zonai_playground
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  meta: ^1.17.0
  # `lib/gen/zonai` -- the output of `zonai gen client` -- imports this, so it
  # is a real dependency of lib/ and not only of the docs' snippets.
  zonai_client:
    path: ../../libs/zonai_client

dev_dependencies:
  test: ^1.26.0
  zonai:
    path: ../zonai
  zonai_schema:
    path: ../../libs/zonai_schema
