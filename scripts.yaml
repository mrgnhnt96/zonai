schema:
  (aliases): [schemas]
  gen:
    internal:
      (command):
        - ${{ schema.gen.internal.tables }}
        - ${{ schema.gen.internal.migrations }}

      tables:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart
        (aliases): [db]
      migrations:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart --migrate {--name}
        (aliases): [migrate, m]

version:
  gen: |
    VERSION=$(cat VERSION)
    mkdir -p apps/zonai/lib/gen
    echo "const kVersion = \"$VERSION\";" > apps/zonai/lib/gen/version.dart

resqlite:
  gen:
    (command):
      - mkdir -p apps/zonai/lib/gen/native
      - |
        # CI (compile.yml) sets ZONAI_SKIP_NATIVE_BUILD=true after
        # downloading a prebuilt library from the native-libs.yml workflow
        # into lib/gen/native/. `native_build_stamp.dart check` confirms that
        # library was built from the sources in *this* checkout, not merely
        # that a file is sitting there -- see its own header for why an
        # existence check let stale bytes ship silently. Unset/false (always
        # the case for local `sip run resqlite gen`) always builds from
        # source, and stamps what it built.
        stamp_args=(--library resqlite)
        if [ -n "$TARGET_ARCH" ]; then
          stamp_args+=(--arch "$TARGET_ARCH")
        fi
        if [ "$ZONAI_SKIP_NATIVE_BUILD" = "true" ] &&
           (cd apps/zonai && dart run tool/native_build_stamp.dart check "${stamp_args[@]}"); then
          echo "Using pre-fetched resqlite native library (ZONAI_SKIP_NATIVE_BUILD=true)"
        else
          (
            cd libs/resqlite || exit 1
            dart pub get || exit 1
            build_args=(--output ../../apps/zonai/lib/gen/native)
            if [ -n "$TARGET_ARCH" ]; then
              build_args+=(--arch "$TARGET_ARCH")
            fi
            dart run tool/build_native.dart "${build_args[@]}"
          ) || exit 1
          (cd apps/zonai && dart run tool/native_build_stamp.dart write "${stamp_args[@]}") || exit 1
        fi
      - cd apps/zonai && dart run tool/generate_resqlite_native.dart
      - dart pub get
    (aliases): [resqlite-native, rn]

argon2:
  gen:
    (command):
      # Current-platform only for now, unlike resqlite.gen -- `dart build
      # cli` (which compiles the vendored libsodium source via sodium's own
      # build hook) doesn't yet have an equivalent to
      # tool/build_native.dart's --arch cross-compilation support.
      - mkdir -p apps/zonai/lib/gen/native
      - |
        cd apps/zonai || exit 1
        # See resqlite.gen's matching comment. This used to be a bare
        # `[ -f ... ]`, which passed for any file of the right name however
        # old -- including one built before the sodium version or the builder
        # script changed underneath it.
        if [ "$ZONAI_SKIP_NATIVE_BUILD" = "true" ] &&
           dart run tool/native_build_stamp.dart check --library argon2; then
          echo "Using pre-fetched Argon2 native library (ZONAI_SKIP_NATIVE_BUILD=true)"
        else
          dart run tool/build_argon2_native.dart || exit 1
          dart run tool/native_build_stamp.dart write --library argon2 || exit 1
        fi
      - cd apps/zonai && dart run tool/generate_argon2_native.dart
      - dart pub get
    (aliases): [argon2-native, an]

db:
  clear-logs:
    (command): cd apps/playground && dart run zonai db logs clear
    (aliases): [logs-clear, clear-logs]
  gen:
    migrations:
      (command): cd apps/db && dart run raindrop_cli:raindrop generate {-n} {--name}
      (aliases): [mig, m, migrate, migration]

raindrop:
  (aliases): [rd, r, rain]
  git:
    sync: |
      cd libs/raindrop || exit 1
      git branch -D main
      git fetch upstream main:main
  vendor: cd libs/zonai_schema && dart run tool/generate_raindrop_vendor.dart

zonai_client:
  (aliases): [client]
  gen: cd libs/zonai_client && dart run tool/sync_revali_client.dart
  stub: cd libs/zonai_client && dart run tool/sync_revali_client.dart --stub

swagger:
  gen: cd apps/server && dart run tool/generate_swagger_assets.dart

web:
  gen:
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr build
      - cd apps/zonai && dart run tool/generate_web_assets.dart
      - dart pub get
    (aliases): [web-assets, wa]
  start:
    (bail):
    (command):
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr serve --no-managed-build-options

docs:
  (aliases): [doc, d]
  # The ⌘K search index is a committed build artifact so `docs start` works
  # from a clean checkout. Regenerate it whenever content/ changes -- `docs
  # test` fails if the committed copy has gone stale.
  index:
    (aliases): [search-index, si]
    (command): cd apps/docs && dart run tool/build_search_index.dart
  start:
    (aliases): [serve, dev]
    (bail):
    (command):
      - ${{ docs.index }}
      - cd apps/docs && dart pub get && dart run jaspr_cli:jaspr serve
  build:
    (bail):
    (command):
      - ${{ docs.index }}
      - cd apps/docs && dart pub get && dart run jaspr_cli:jaspr build
  test:
    (aliases): [t]
    (bail):
    (command):
      - ${{ docs.build }}
      - cd apps/docs && dart test

server:
  sync-to-cli:
    (aliases): [sync, s]
    (bail):
    (command):
      - test -f apps/server/.revali/server/server.dart || (echo "Revali server generation failed" && exit 1)
      - rm -rf apps/zonai/lib/gen/server
      - mkdir -p apps/zonai/lib/gen
      - cp -r apps/server apps/zonai/lib/gen
      - cd apps/server && dart run tool/generate_swagger_assets.dart
      - |
        cd apps/zonai/lib/gen/server || exit 1
        rm -f pubspec.yaml
        rm -rf .revali/revali_client
        rm -rf .dart_tool
        rm -f revali.yaml

        # replace `package:zonai_server` with `./` from all *.dart files.
        # Use perl instead of sed for in-place replacement
        find lib -name '*.dart' -exec perl -pi -e 's|package:zonai_server/src|..|g' {} +
        find . -name '*.dart' -exec perl -pi -e 's|package:zonai_server|../../lib|g' {} +

      - test -f apps/server/.revali/revali_client/lib/client.dart || (echo "Revali client generation failed; run server gen first" && exit 1)
      - cd libs/zonai_client && dart run tool/sync_revali_client.dart
  copy-to-cli:
    (aliases): [cli, copy, c]
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      - cd apps/server && dart run revali dev --generate-only --flavor dev --release --recompile
      - ${{ server.sync-to-cli }}
  gen:
    - |
      cd apps/server || exit 1
      dart run revali dev --flavor dev --profile --recompile --generate-only
    - ${{ server.sync-to-cli }}
  start: |
    cd apps/server || exit 1
    dart pub get || exit 1
    dart run revali dev --flavor dev {--recompile} {--loud}

playground:
  (aliases): [play]

  zonai: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart serve --log verbose

  compile: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart compile --log verbose

  test:
    (command): |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db test --log verbose
    photos: |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db photos --log verbose

  photos: |
    cd apps/playground || exit 1
    dart run --enable-asserts zonai db photos --log verbose

  migrate: |
    cd apps/playground || exit 1
    dart run zonai db migrate generate --name update

  serve: |
    cd apps/playground || exit 1
    dart run zonai serve --log verbose
  dev: |
    cd apps/playground || exit 1
    dart run zonai dev --log verbose

  clear-logs: |
    cd apps/playground || exit 1
    dart run zonai db logs clear --log verbose

test:
  (aliases): [t]
  (description): >-
    L0+L1+L2 -- what a contributor runs before pushing. Explicit suite lists
    only, never `dart test --recursive`: that would sweep the submodules
    and the e2e fixtures into a suite nobody owns, and their failures would
    get normalised. A suite that isn't run here is skipped out loud below,
    not silently.
  (command):
    - ${{ test.static }}
    - ${{ test.unit }}
  static:
    (description): L0 -- compiles, formats, and the shell embedded in scripts.yaml/workflows. Budget < 2 min.
    (command):
      - dart analyze .
      - dart format --output=none --set-exit-if-changed .
      - bash tool/ci/check_shell_syntax.sh
      - bash tool/ci/check_workflows.sh
  unit:
    (description): >-
      L1 -- pure logic, no native build required. libs/resqlite and
      libs/raindrop are deliberately excluded: see `test submodules` for
      why they carry their own prerequisites. apps/zonai is excluded too:
      see `test cli`, which needs `bootstrap test` first.
    (command):
      - cd libs/zonai_schema && dart test
      - cd libs/zonai_client && dart test
      - cd libs/zonai_logger && dart test
      - cd apps/server && dart test
      - cd apps/web && dart test
      - cd apps/playground && dart test
      - cd apps/docs && dart test
  cli:
    (description): >-
      L2+L3 -- the CLI's own suite, including its compiled-binary e2e
      tests. Needs `sip run bootstrap test` first so lib/gen exists; this
      target does not run it for you, so it fails loudly rather than
      passing against a stale or missing lib/gen.
    (command): cd apps/zonai && dart test
  e2e:
    (description): >-
      L3 -- drives the e2e/ fixture projects through a real compiled
      binary. tool/ci/run_e2e.sh does not exist yet (see
      docs/testing-strategy.md Step 3), so this fails loudly instead of
      silently exiting 0 for a layer that runs nothing.
    (command): |
      echo "test e2e: not implemented yet -- tool/ci/run_e2e.sh does not exist. See docs/testing-strategy.md Step 3." >&2
      exit 1
  submodules:
    (description): >-
      Prerequisite-carrying suites, kept out of `unit` on purpose.
      libs/resqlite needs its own native build first -- into its own
      .dart_tool/lib, NOT the apps/zonai build path, which its test setup
      does not check -- or its whole suite fails to load
      ("Resqlite native library not loaded").
    (command):
      - cd libs/resqlite && dart run tool/build_native.dart --output .dart_tool/lib && dart test
      - cd libs/raindrop/packages/raindrop && dart test
      - cd libs/raindrop/packages/raindrop_cli && dart test
      - cd libs/raindrop/packages/raindrop_sqlite && dart test
      - cd libs/raindrop/packages/raindrop_test && dart test
      - cd libs/raindrop/packages/raindrop_postgres && dart test

bootstrap:
  test:
    (aliases): [tests, t]
    (description): >-
      Generates everything apps/zonai's test suite needs to load (lib/gen's
      native/ and server/ subtrees) without doing a full `zonai compile` --
      no web build, no raindrop vendor re-run (already committed), no
      final `dart compile exe`. Run this once after a clean checkout (and
      `dart pub get`) before `dart test` in apps/zonai.
    (bail):
    (command):
      - ${{ version.gen }}
      - |
        echo "Generating resqlite native library"
        ${{ resqlite.gen }}
      - |
        echo "Generating native Argon2 library"
        ${{ argon2.gen }}
      - |
        echo "Generating server artifacts (apps/zonai/lib/gen/server)"
        ${{ server.copy-to-cli }}

zonai:
  # compiles server, web, and cli in 1 executable
  compile:
    (bail):
    (command):
      - ${{ version.gen }}
      - |
        echo "Vendoring raindrop into zonai_schema"
        ${{ raindrop.vendor }}
      - ${{ server.copy-to-cli }}
      - |
        echo "Generating resqlite native library"
        ${{ resqlite.gen }}
      - |
        echo "Generating native Argon2 library"
        ${{ argon2.gen }}
      - |
        echo "Generating embedded web assets"
        ${{ web.gen }}
      - |
        BUILD_DIR="$(pwd)/build"
        # Without deleting the directory, clear out all the files (recursively) in the directory
        mkdir -p $BUILD_DIR
        find $BUILD_DIR -type f -delete

        cd apps/zonai || exit 1
        dart pub get || exit 1

        echo "Compiling zonai"

        OUTPUT="$BUILD_DIR/zonai"
        if [ "$RUNNER_OS" = "Windows" ]; then
          OUTPUT="$OUTPUT.exe"
        fi

        compile_args=(-D__ZONAI_COMPILED__=true bin/zonai.dart -o "$OUTPUT")
        # Dart cannot cross-compile to macOS from Apple Silicon; macOS x64
        # builds must run on Intel hardware (e.g. macos-15-intel in CI).
        if [ -n "$TARGET_ARCH" ] && [ "$(uname -s)" = "Linux" ]; then
          compile_args=(--target-os linux --target-arch "$TARGET_ARCH" "${compile_args[@]}")
        fi

        dart compile exe "${compile_args[@]}"
