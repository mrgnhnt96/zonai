schema:
  (aliases): [schemas]
  gen:
    internal:
      (command):
        - ${{ schema.gen.internal.tables }}
        - ${{ schema.gen.internal.migrations }}

      tables:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart
        (aliases): [db]
      migrations:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart --migrate {--name}
        (aliases): [migrate, m]

version:
  gen: |
    VERSION=$(cat VERSION)
    mkdir -p apps/zonai/lib/gen
    echo "const kVersion = \"$VERSION\";" > apps/zonai/lib/gen/version.dart

resqlite:
  gen:
    (command):
      - mkdir -p apps/zonai/lib/gen/native
      - |
        cd libs/resqlite || exit 1
        dart pub get || exit 1
        build_args=(--output ../../apps/zonai/lib/gen/native)
        if [ -n "$TARGET_ARCH" ]; then
          build_args+=(--arch "$TARGET_ARCH")
        fi
        dart run tool/build_native.dart "${build_args[@]}"
      - cd apps/zonai && dart run tool/generate_resqlite_native.dart
      - dart pub get
    (aliases): [resqlite-native, rn]

db:
  clear-logs:
    (command): cd apps/playground && dart run zonai db logs clear
    (aliases): [logs-clear, clear-logs]
  gen:
    migrations:
      (command): cd apps/db && dart run raindrop_cli:raindrop generate {-n} {--name}
      (aliases): [mig, m, migrate, migration]

raindrop:
  (aliases): [rd, r, rain]
  git:
    sync: |
      cd libs/raindrop || exit 1
      git branch -D main
      git fetch upstream main:main

zonai_client:
  (aliases): [client]
  gen: cd libs/zonai_client && dart run tool/sync_revali_client.dart
  stub: cd libs/zonai_client && dart run tool/sync_revali_client.dart --stub

swagger:
  gen: cd apps/server && dart run tool/generate_swagger_assets.dart

web:
  gen:
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr build
      - cd apps/zonai && dart run tool/generate_web_assets.dart
      - dart pub get
    (aliases): [web-assets, wa]
  start:
    (bail):
    (command):
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr serve --no-managed-build-options

server:
  sync-to-cli:
    (aliases): [sync, s]
    (bail):
    (command):
      - test -f apps/server/.revali/server/server.dart || (echo "Revali server generation failed" && exit 1)
      - rm -rf apps/zonai/lib/gen/server
      - mkdir -p apps/zonai/lib/gen
      - cp -r apps/server apps/zonai/lib/gen
      - cd apps/server && dart run tool/generate_swagger_assets.dart
      - |
        cd apps/zonai/lib/gen/server || exit 1
        rm -f pubspec.yaml
        rm -rf .revali/revali_client
        rm -rf .dart_tool
        rm -f revali.yaml

        # replace `package:zonai_server` with `./` from all *.dart files.
        # Use perl instead of sed for in-place replacement
        find lib -name '*.dart' -exec perl -pi -e 's|package:zonai_server/src|..|g' {} +
        find . -name '*.dart' -exec perl -pi -e 's|package:zonai_server|../../lib|g' {} +

      - test -f apps/server/.revali/revali_client/lib/client.dart || (echo "Revali client generation failed; run server gen first" && exit 1)
      - cd libs/zonai_client && dart run tool/sync_revali_client.dart
  copy-to-cli:
    (aliases): [cli, copy, c]
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      - cd apps/server && dart run revali dev --generate-only --flavor dev --release --recompile
      - ${{ server.sync-to-cli }}
  gen:
    - |
      cd apps/server || exit 1
      dart run revali dev --flavor dev --profile --recompile --generate-only
    - ${{ server.sync-to-cli }}
  start: |
    cd apps/server || exit 1
    dart pub get || exit 1
    dart run revali dev --flavor dev {--recompile} {--loud}

playground:
  (aliases): [play]

  zonai: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart serve --log verbose

  compile: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart compile --log verbose

  test:
    (command): |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db test --log verbose
    photos: |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db photos --log verbose

  photos: |
    cd apps/playground || exit 1
    dart run --enable-asserts zonai db photos --log verbose

  migrate: |
    cd apps/playground || exit 1
    dart run zonai db migrate generate --name update

  serve: |
    cd apps/playground || exit 1
    dart run zonai serve --log verbose
  dev: |
    cd apps/playground || exit 1
    dart run zonai dev --log verbose

  clear-logs: |
    cd apps/playground || exit 1
    dart run zonai db logs clear --log verbose

zonai:
  # compiles server, web, and cli in 1 executable
  compile:
    (bail):
    (command):
      - ${{ version.gen }}
      - ${{ server.copy-to-cli }}
      - |
        echo "Generating resqlite native library"
        ${{ resqlite.gen }}
      - |
        echo "Generating embedded web assets"
        ${{ web.gen }}
      - |
        BUILD_DIR="$(pwd)/build"
        # Without deleting the directory, clear out all the files (recursively) in the directory
        mkdir -p $BUILD_DIR
        find $BUILD_DIR -type f -delete

        cd apps/zonai || exit 1
        dart pub get || exit 1

        echo "Compiling zonai"

        OUTPUT="$BUILD_DIR/zonai"
        if [ "$RUNNER_OS" = "Windows" ]; then
          OUTPUT="$OUTPUT.exe"
        fi

        compile_args=(-D__ZONAI_COMPILED__=true bin/zonai.dart -o "$OUTPUT")
        # Dart cannot cross-compile to macOS from Apple Silicon; macOS x64
        # builds must run on Intel hardware (e.g. macos-15-intel in CI).
        if [ -n "$TARGET_ARCH" ] && [ "$(uname -s)" = "Linux" ]; then
          compile_args=(--target-os linux --target-arch "$TARGET_ARCH" "${compile_args[@]}")
        fi

        dart compile exe "${compile_args[@]}"
