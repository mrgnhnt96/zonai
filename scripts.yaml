schema:
  (aliases): [schemas]
  gen:
    internal:
      (command):
        - ${{ schema.gen.internal.tables }}
        - ${{ schema.gen.internal.migrations }}

      tables:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart
        (aliases): [db]
      migrations:
        (command): cd apps/zonai && dart run tool/generate_internal_db_artifacts.dart --migrate {--name}
        (aliases): [migrate, m]

version:
  gen: |
    VERSION=$(cat VERSION)
    mkdir -p apps/zonai/lib/gen
    echo "const kVersion = \"$VERSION\";" > apps/zonai/lib/gen/version.dart

resqlite:
  gen:
    (command):
      - mkdir -p apps/zonai/lib/gen/native
      - |
        # CI (compile.yml) sets ZONAI_SKIP_NATIVE_BUILD=true after
        # downloading a prebuilt library from the native-libs.yml workflow
        # into lib/gen/native/. `native_build_stamp.dart check` confirms that
        # library was built from the sources in *this* checkout, not merely
        # that a file is sitting there -- see its own header for why an
        # existence check let stale bytes ship silently. Unset/false (always
        # the case for local `sip run resqlite gen`) always builds from
        # source, and stamps what it built.
        stamp_args=(--library resqlite)
        if [ -n "$TARGET_ARCH" ]; then
          stamp_args+=(--arch "$TARGET_ARCH")
        fi
        if [ "$ZONAI_SKIP_NATIVE_BUILD" = "true" ] &&
           (cd apps/zonai && dart run tool/native_build_stamp.dart check "${stamp_args[@]}"); then
          echo "Using pre-fetched resqlite native library (ZONAI_SKIP_NATIVE_BUILD=true)"
        else
          (
            cd libs/resqlite || exit 1
            dart pub get || exit 1
            build_args=(--output ../../apps/zonai/lib/gen/native)
            if [ -n "$TARGET_ARCH" ]; then
              build_args+=(--arch "$TARGET_ARCH")
            fi
            dart run tool/build_native.dart "${build_args[@]}"
          ) || exit 1
          (cd apps/zonai && dart run tool/native_build_stamp.dart write "${stamp_args[@]}") || exit 1
        fi
      - cd apps/zonai && dart run tool/generate_resqlite_native.dart
      - dart pub get
    (aliases): [resqlite-native, rn]

argon2:
  gen:
    (command):
      # Current-platform only for now, unlike resqlite.gen -- `dart build
      # cli` (which compiles the vendored libsodium source via sodium's own
      # build hook) doesn't yet have an equivalent to
      # tool/build_native.dart's --arch cross-compilation support.
      - mkdir -p apps/zonai/lib/gen/native
      - |
        cd apps/zonai || exit 1
        # See resqlite.gen's matching comment. This used to be a bare
        # `[ -f ... ]`, which passed for any file of the right name however
        # old -- including one built before the sodium version or the builder
        # script changed underneath it.
        if [ "$ZONAI_SKIP_NATIVE_BUILD" = "true" ] &&
           dart run tool/native_build_stamp.dart check --library argon2; then
          echo "Using pre-fetched Argon2 native library (ZONAI_SKIP_NATIVE_BUILD=true)"
        else
          dart run tool/build_argon2_native.dart || exit 1
          dart run tool/native_build_stamp.dart write --library argon2 || exit 1
        fi
      - cd apps/zonai && dart run tool/generate_argon2_native.dart
      - dart pub get
    (aliases): [argon2-native, an]

db:
  clear-logs:
    (command): cd apps/playground && dart run zonai db logs clear
    (aliases): [logs-clear, clear-logs]
  gen:
    migrations:
      (command): cd apps/db && dart run raindrop_cli:raindrop generate {-n} {--name}
      (aliases): [mig, m, migrate, migration]

raindrop:
  (aliases): [rd, r, rain]
  git:
    sync: |
      cd libs/raindrop || exit 1
      git branch -D main
      git fetch upstream main:main
  vendor: cd libs/zonai_schema && dart run tool/generate_raindrop_vendor.dart

zonai_client:
  (aliases): [client]
  gen: cd libs/zonai_client && dart run tool/sync_revali_client.dart
  stub: cd libs/zonai_client && dart run tool/sync_revali_client.dart --stub

swagger:
  gen: cd apps/server && dart run tool/generate_swagger_assets.dart

web:
  gen:
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr build
      - cd apps/zonai && dart run tool/generate_web_assets.dart
      - dart pub get
    (aliases): [web-assets, wa]
  start:
    (bail):
    (command):
      - ${{ server.sync-to-cli }}
      - cd apps/web && dart pub get && dart run jaspr_cli:jaspr serve --no-managed-build-options

docs:
  (aliases): [doc, d]
  # The ⌘K search index is a committed build artifact so `docs start` works
  # from a clean checkout. Regenerate it whenever content/ changes -- `docs
  # test` fails if the committed copy has gone stale.
  index:
    (aliases): [search-index, si]
    (command): cd apps/docs && dart run tool/build_search_index.dart
  # Same deal as the search index: committed so a clean checkout serves it, and
  # regenerated on every build so a new page cannot ship unlisted.
  sitemap:
    (aliases): [map]
    (command): cd apps/docs && dart run tool/build_sitemap.dart
  start:
    (aliases): [serve, dev]
    (bail):
    (command):
      - ${{ docs.index }}
      - ${{ docs.sitemap }}
      - cd apps/docs && dart pub get && dart run jaspr_cli:jaspr serve
  build:
    (bail):
    (command):
      - ${{ docs.index }}
      - ${{ docs.sitemap }}
      # Not `cd apps/docs && dart run jaspr_cli:jaspr build` directly any more:
      # jaspr's static generator binds 8080 unconditionally, and a foreign
      # listener there makes every route fail with a 404 that reads like broken
      # content. The wrapper names the pid instead. Why the fix is not ours to
      # make is in the script.
      - bash tool/ci/docs_build.sh
  test:
    (aliases): [t]
    (bail):
    (command):
      - ${{ docs.build }}
      - cd apps/docs && dart test

server:
  sync-to-cli:
    (aliases): [sync, s]
    (bail):
    (command):
      - test -f apps/server/.revali/server/server.dart || (echo "Revali server generation failed" && exit 1)
      # Before the copy, not after. Regenerating swagger into apps/server
      # *after* apps/zonai/lib/gen/server has already been copied leaves the
      # embedded mirror holding the previous surface, so the binary serves a
      # swagger doc that is one route change behind and a single run of this
      # target never converges -- you need two. Caught by
      # `apps/zonai/tool/server_mirror_check.dart`, which reported exactly
      # `lib/gen/swagger_assets.dart differs` the first time a route was
      # added after that check existed.
      - cd apps/server && dart run tool/generate_swagger_assets.dart
      - rm -rf apps/zonai/lib/gen/server
      - mkdir -p apps/zonai/lib/gen
      - cp -r apps/server apps/zonai/lib/gen
      - |
        cd apps/zonai/lib/gen/server || exit 1
        rm -f pubspec.yaml
        rm -rf .revali/revali_client
        rm -rf .dart_tool
        rm -f revali.yaml

        # replace `package:zonai_server` with `./` from all *.dart files.
        # Use perl instead of sed for in-place replacement
        find lib -name '*.dart' -exec perl -pi -e 's|package:zonai_server/src|..|g' {} +
        find . -name '*.dart' -exec perl -pi -e 's|package:zonai_server|../../lib|g' {} +

      - test -f apps/server/.revali/revali_client/lib/client.dart || (echo "Revali client generation failed; run server gen first" && exit 1)
      - cd libs/zonai_client && dart run tool/sync_revali_client.dart
  copy-to-cli:
    (aliases): [cli, copy, c]
    (bail):
    (command):
      - cd apps/zonai && dart run tool/generate_web_assets.dart --stub
      # Not `cd apps/server && dart run revali dev ...` directly any more: that
      # command loses a race inside revali's analyzer under file-handle
      # pressure, and the wrapper retries THAT failure and nothing else. Why it
      # happens, and why the fix is not ours to make, is in the script.
      - bash tool/ci/revali_generate.sh
      - ${{ server.sync-to-cli }}
  gen:
    - |
      cd apps/server || exit 1
      dart run revali dev --flavor dev --profile --recompile --generate-only
    - ${{ server.sync-to-cli }}
  start: |
    cd apps/server || exit 1
    dart pub get || exit 1
    dart run revali dev --flavor dev {--recompile} {--loud}

playground:
  (aliases): [play]

  zonai: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart serve --log verbose

  compile: |
    cd apps/playground || exit 1
    dart run --enable-asserts ../zonai/bin/zonai.dart compile --log verbose

  test:
    (command): |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db test --log verbose
    photos: |
      cd apps/playground || exit 1
      dart run --enable-asserts zonai db photos --log verbose

  photos: |
    cd apps/playground || exit 1
    dart run --enable-asserts zonai db photos --log verbose

  migrate: |
    cd apps/playground || exit 1
    dart run zonai db migrate generate --name update

  serve: |
    cd apps/playground || exit 1
    dart run zonai serve --log verbose
  dev: |
    cd apps/playground || exit 1
    dart run zonai dev --log verbose

  clear-logs: |
    cd apps/playground || exit 1
    dart run zonai db logs clear --log verbose

test:
  (aliases): [t]
  (description): >-
    L0+L1+L2 -- what a contributor runs before pushing. Explicit suite lists
    only, never `dart test --recursive`: that would sweep the submodules
    and the e2e fixtures into a suite nobody owns, and their failures would
    get normalised. A suite that isn't run here is skipped out loud below,
    not silently.
  (command):
    - ${{ test.static }}
    - ${{ test.unit }}
  static:
    (description): L0 -- compiles, formats, and the shell embedded in scripts.yaml/workflows. Budget < 2 min.
    (command):
      # Resolve, THEN analyze -- one command, because the resolve is a
      # prerequisite of the analyze and not an independent check. Split across
      # two list items they could be reordered, or the analyze could run on a
      # tree the resolve failed to prepare and report 226 import errors instead
      # of the one line saying why.
      #
      # `dart analyze .` walks INTO the nine tracked packages that are NOT
      # members of the root pub workspace (`libs/**`, `support/**`, `apps/*` --
      # note the shallow glob, so apps/zonai/tool/native/argon2_builder is out
      # too). The root `dart pub get` therefore never resolves them and every
      # cross-file import inside them reads as unresolved.
      #
      # MEASURED 2026-08-14 from a genuinely clean tree -- no .dart_tool
      # anywhere, root `dart pub get` only, i.e. exactly what a CI runner has:
      # 226 errors, 224 of which are nothing but unresolvedness (168 across
      # e2e/*, 56 in stress/bin, 2 in argon2_builder). The loop below costs
      # 4.2s against this target's < 2 min budget and takes the same analyze to
      # exit 0. It is not an optimisation of a passing check -- without it the
      # static job cannot pass on a fresh runner at all.
      #
      # A dev machine passes only because of leftover .dart_tool from some
      # earlier `sip run test e2e` / `bootstrap test`. That state is gitignored,
      # untracked and machine-local: any `git clean -xdf` destroys it, and no
      # runner ever had it. A gate must not rest on it.
      #
      # Kept deliberately in step with the `resolve` check in .showrunner's
      # config.json, which resolves the same set for the same reason -- plus
      # argon2_builder, which that copy misses (it is the last 2 of the 226).
      #
      # stress/fixture/ joined this loop 2026-08-14: it used to provably fail
      # here (transitive raindrop_cli -> `raindrop ^0.0.1`, only satisfiable
      # inside the root pub workspace), fixed via `dependency_overrides` in
      # stress/fixture/pubspec.yaml pinning `raindrop` and `zonai_schema` to
      # their local paths -- see that file's comment for the full chain.
      - |
        for d in e2e/*/ stress/ stress/fixture/ apps/zonai/tool/native/argon2_builder/; do
          if ! (cd "$d" && dart pub get >/dev/null); then
            echo "dart pub get failed in $d -- dart analyze . would report every" >&2
            echo "import in it as unresolved. Fix the resolve, not the analyze." >&2
            exit 1
          fi
        done
        dart analyze .
      # Formats what HUMANS write, not `.`. Two things `.` sweeps in that must not
      # be reformatted: **/lib/gen/** (130 tracked generated files -- the next
      # generator run reverts any reformat, so the gate would flap forever), and
      # libs/raindrop + libs/resqlite, which are SEPARATE GIT REPOS -- reformatting
      # a vendored fork makes every future upstream sync conflict. Driving off
      # `git ls-files` excludes the submodules by construction (they are gitlinks,
      # not files) and gitignored generated trees too; the grep drops the tracked
      # generated ones. One `dart format` invocation rather than `xargs`, because
      # xargs may split the list and only the LAST batch's exit code would survive
      # -- a gate that silently checks a subset is worse than none.
      - dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '/lib/gen/')
      - bash tool/ci/check_shell_syntax.sh
      - bash tool/ci/check_workflows.sh
      # Lives in `static` rather than in .game_loop/verify.yaml, where the
      # Crawler that found this proposed it: verify.yaml is gitignored, so a
      # rule there cannot ride a branch and protects only the machine it was
      # written on. The failure it prevents is one NO local check can see --
      # revali's codegen aborts on a dot-shorthand annotation argument on a CI
      # runner while every dev machine stays green (seven configurations tried,
      # docs/revali-dot-shorthand-codegen.md). A guard against a CI-only
      # failure belongs where CI runs it.
      - bash tool/ci/check_dot_shorthand_annotations.sh
      # Milliseconds, and it belongs here rather than in `unit` because of WHEN
      # it answers, not whether. The golden suites already catch a stale
      # generated client -- they caught this one -- but they run in `Test /
      # unit`, downstream of Compile building five platform binaries, so a
      # one-line VERSION bump took about fifteen minutes and a whole chain to
      # come back wrong, and fixing it meant a new sha and the chain again.
      - bash tool/ci/check_generated_client_version.sh
      # Controls for step 3 of verify_cross_target_bundle.sh, which was narrowed
      # after v0.8.1 (run 32312355513) went red for a bundle behaving correctly:
      # its host binary was a different release from the libraries beside it, so
      # self-extraction was always going to replace them. Skipping that case is
      # only safe while a REAL replacement still fails, and the post-release job
      # that would notice runs once per release, after the release. This asks
      # the same question in `static`, in seconds, against a synthetic bundle.
      - bash tool/ci/test_verify_cross_target_bundle.sh
      # apps/zonai/lib/gen/server is a gitignored COPY of apps/server that
      # `zonai compile` embeds, so nothing in git keeps it honest -- and
      # analysis_options.yaml excludes **/lib/gen/**, so `dart analyze` is
      # structurally blind to it. A stale copy surfaces only as `dart test`
      # failing to LOAD, with errors naming types the developer just added and
      # did nothing wrong with; it has cost four separate debugging sessions,
      # including every fresh git worktree, which gets the copy injected from
      # whatever branch the main checkout is on. Lives in `static` rather than
      # verify.yaml because verify.yaml is gitignored and cannot ride a branch.
      - cd apps/zonai && dart run tool/server_mirror_check.dart
  unit:
    (description): >-
      L1 -- pure logic, no native build required. libs/resqlite and
      libs/raindrop are deliberately excluded: see `test submodules` for
      why they carry their own prerequisites. apps/zonai is excluded too:
      see `test cli`, which needs `bootstrap test` first.
    (command):
      - cd libs/zonai_schema && dart test
      - cd libs/zonai_client && dart test
      - cd libs/zonai_logger && dart test
      - cd apps/server && dart test
      - cd apps/web && dart test
      - cd apps/playground && dart test
  docs:
    (description): >-
      L1, but SEPARATE from `unit` because it carries a prerequisite the
      others do not: apps/docs' `anchors` test calls markTestSkipped when
      build/jaspr is absent. Run bare, it therefore reports green BY NOT
      RUNNING -- and run against a STALE build it reports red, so the same
      command gave three different answers depending on what happened to be
      lying around. Measured 2026-08-13: skipped in a fresh worktree, failed
      on the main checkout against a build from 14:18 that predated the day's
      content changes. The jaspr build is slow, which is why this is its own
      target rather than a line in `unit`; CI must run it, and must not treat
      a skip here as a pass.
    (command):
      - ${{ docs.build }}
      - cd apps/docs && dart test
  cli:
    (description): >-
      L2+L3 -- the CLI's own suite, including its compiled-binary e2e
      tests. Needs `sip run bootstrap test` first so lib/gen exists; this
      target does not run it for you, so it fails loudly rather than
      passing against a stale or missing lib/gen.
    (command): cd apps/zonai && dart test
  e2e:
    (description): >-
      L3 -- drives the e2e/ fixture projects through a real compiled binary
      (init/compile -> migrate generate -> migrate apply -> serve -> HTTP
      assertions -> restart -> re-assert), asserting on response bodies and
      database contents rather than exit codes. Needs a compiled binary:
      `sip run zonai compile` first, or ZONAI_E2E_BINARY=<path>. It resolves
      one rather than building one, for the same reason `test cli` does not
      run `bootstrap test` for you.

      Each mutation fixture runs on BOTH Mailman transports. Not
      linked-vs-forced-workers: e2e/* depend on zonai_schema and not on
      zonai, so a bare CLI reports `Ops/rules: worker IPC` either way and
      ZONAI_FORCE_WORKERS changes nothing there. The isolate transport is
      the one 551081f and 02cfcef failed on, and run_e2e.sh asserts the
      rules/operations workers really took it -- an unspawnable snapshot
      falls back to the process transport with nothing but a log warning.
    (command): bash tool/ci/run_e2e.sh
  submodules:
    (description): >-
      Prerequisite-carrying suites, kept out of `unit` on purpose.
      libs/resqlite needs its own native build first -- into its own
      .dart_tool/lib, NOT the apps/zonai build path, which its test setup
      does not check -- or its whole suite fails to load
      ("Resqlite native library not loaded").
    (command):
      - cd libs/resqlite && dart run tool/build_native.dart --output .dart_tool/lib && dart test
      - cd libs/raindrop/packages/raindrop && dart test
      - cd libs/raindrop/packages/raindrop_cli && dart test
      - cd libs/raindrop/packages/raindrop_sqlite && dart test
      - cd libs/raindrop/packages/raindrop_test && dart test
      - cd libs/raindrop/packages/raindrop_postgres && dart test

bootstrap:
  test:
    (aliases): [tests, t]
    (description): >-
      Generates everything apps/zonai's test suite needs to load (lib/gen's
      native/ and server/ subtrees) without doing a full `zonai compile` --
      no web build, no raindrop vendor re-run (already committed), no
      final `dart compile exe`. Run this once after a clean checkout (and
      `dart pub get`) before `dart test` in apps/zonai.
    (bail):
    (command):
      - ${{ version.gen }}
      # SERVER ARTIFACTS FIRST, and the order is load-bearing on Windows.
      #
      # This used to run last, after both native gens, and on windows-latest it
      # failed DETERMINISTICALLY -- `unit` lost revali's SDK-mirror race 6 times
      # out of 6 with the retry wrapper in place, while every job that reaches
      # the same codegen through `zonai compile` passed. The difference between
      # those two sets is exactly this ordering: `zonai compile` runs
      # copy-to-cli BEFORE its native gens, `bootstrap test` ran it after.
      #
      #   zonai compile   -> copy-to-cli early : Compile/windows PASS, e2e/windows PASS
      #   bootstrap test  -> copy-to-cli last  : unit/windows FAIL, cli/windows FAIL
      #
      # The mechanism is the one in tool/ci/revali_generate.sh: revali mirrors
      # the workspace and the whole SDK into memory under one unbounded
      # `Future.wait`, so the more that is on disk when it runs, the likelier a
      # read is dropped. Running the gens first adds their output to what gets
      # mirrored. Everything here was green at v0.7.2 in either order; the OAuth
      # merge pushed the later position over the edge and left the earlier one
      # under it.
      #
      # Nothing depends on the reordering being wrong: `zonai compile` has
      # always run copy-to-cli before the native gens, so it cannot need them.
      - |
        echo "Generating server artifacts (apps/zonai/lib/gen/server)"
        ${{ server.copy-to-cli }}
      - |
        echo "Generating resqlite native library"
        ${{ resqlite.gen }}
      - |
        echo "Generating native Argon2 library"
        ${{ argon2.gen }}

zonai:
  # compiles server, web, and cli in 1 executable
  compile:
    (bail):
    (command):
      - ${{ version.gen }}
      - |
        echo "Vendoring raindrop into zonai_schema"
        ${{ raindrop.vendor }}
      - ${{ server.copy-to-cli }}
      - |
        echo "Generating resqlite native library"
        ${{ resqlite.gen }}
      - |
        echo "Generating native Argon2 library"
        ${{ argon2.gen }}
      - |
        echo "Generating embedded web assets"
        ${{ web.gen }}
      - |
        BUILD_DIR="$(pwd)/build"
        # Without deleting the directory, clear out all the files (recursively) in the directory
        mkdir -p $BUILD_DIR
        find $BUILD_DIR -type f -delete

        cd apps/zonai || exit 1
        dart pub get || exit 1

        echo "Compiling zonai"

        OUTPUT="$BUILD_DIR/zonai"
        if [ "$RUNNER_OS" = "Windows" ]; then
          OUTPUT="$OUTPUT.exe"
        fi

        compile_args=(-D__ZONAI_COMPILED__=true bin/zonai.dart -o "$OUTPUT")
        # Dart cannot cross-compile to macOS from Apple Silicon; macOS x64
        # builds must run on Intel hardware (e.g. macos-15-intel in CI).
        if [ -n "$TARGET_ARCH" ] && [ "$(uname -s)" = "Linux" ]; then
          compile_args=(--target-os linux --target-arch "$TARGET_ARCH" "${compile_args[@]}")
        fi

        dart compile exe "${compile_args[@]}"
