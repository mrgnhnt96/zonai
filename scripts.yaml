db:
  gen:
    migrations:
      (command): cd apps/db && dart run raindrop_cli:raindrop generate {-n} {--name}
      (aliases): [mig, m, migrate, migration]

raindrop:
  (aliases): [rd, r, rain]
  git:
    sync: |
      cd libs/raindrop || exit 1
      git branch -D main
      git fetch upstream main:main

revali:
  copy-to-cli:
    (aliases): [cli, copy, c]
    (bail):
    (command):
      # - cd apps/server && dart run revali dev --generate-only --flavor dev --profile --recompile
      - rm -rf apps/zonai/lib/.revali
      - mkdir -p apps/zonai/lib/gen/server
      - cp -r apps/server apps/zonai/lib/gen
      - |
        cd apps/zonai/lib/gen/server || exit 1
        rm pubspec.yaml
        rm -rf .revali/revali_client
        rm -rf .dart_tool

        # replace `package:zonai_server` with `./` from all *.dart files.
        # Use perl instead of sed for in-place replacement
        find lib -name '*.dart' -exec perl -pi -e 's|package:zonai_server/src|..|g' {} +
        find routes -name '*.dart' -exec perl -pi -e 's|package:zonai_server|../../lib|g' {} +

playground:
  (aliases): [play]

  compile: |
    cd apps/playground || exit 1
    dart run --enable-asserts zonai compile --log verbose

  test: |
    cd apps/playground || exit 1
    dart run --enable-experiment=native-assets --enable-asserts zonai db test --log verbose

  migrate: |
    cd apps/playground || exit 1
    dart run zonai db migrate generate --name update
