name: Native Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: native-libs-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: native-libs-linux-arm64
          - os: macos-latest
            artifact_name: native-libs-macos-arm64
          - os: macos-15-intel
            artifact_name: native-libs-macos-x64
            target_arch: x64
            dart_architecture: x64
          - os: windows-latest
            artifact_name: native-libs-windows-x64

    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is private.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Set up Dart
        if: matrix.dart_architecture != 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Set up Dart (x64)
        if: matrix.dart_architecture == 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"
          architecture: x64

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Get dependencies
        run: dart pub get

      - name: Install native build toolchain (Linux)
        # argon2's build hook compiles libsodium via an autoconf/make build
        # (see tool/native/argon2_builder); mirrors compile.yml's own step.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      - name: Build resqlite native library
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          mkdir -p apps/zonai/lib/gen/native
          (
            cd libs/resqlite
            dart pub get
            build_args=(--output ../../apps/zonai/lib/gen/native)
            if [ -n "$TARGET_ARCH" ]; then
              build_args+=(--arch "$TARGET_ARCH")
            fi
            dart run tool/build_native.dart "${build_args[@]}"
          )
          # The sidecar that lets compile.yml tell this artifact apart from one
          # built before the submodule pin moved. It travels in the artifact
          # because the upload below takes the whole directory.
          stamp_args=(--library resqlite)
          if [ -n "$TARGET_ARCH" ]; then
            stamp_args+=(--arch "$TARGET_ARCH")
          fi
          cd apps/zonai && dart run tool/native_build_stamp.dart write "${stamp_args[@]}"

      - name: Build Argon2 native library
        shell: bash
        # Current-platform only for now, unlike resqlite -- see
        # apps/zonai/tool/build_argon2_native.dart's comment: `dart build
        # cli` doesn't yet have an equivalent to build_native.dart's --arch
        # cross-compilation support.
        run: |
          mkdir -p apps/zonai/lib/gen/native
          cd apps/zonai
          dart run tool/build_argon2_native.dart
          dart run tool/native_build_stamp.dart write --library argon2

      # UNLIKE every other artifact in this repo, this one is not a step on the
      # way to a release and no release contains it. It is purely compile.yml's
      # cross-run build cache: compile.yml pulls "latest successful run of
      # native-libs.yml" to skip rebuilding libsodium via autoconf on every
      # platform, every run.
      #
      # So retention here is not storage hygiene, it is cache lifetime. This
      # workflow is workflow_dispatch-only, so with 10 days the cache is only
      # warm for 10 days after someone remembers to dispatch it; past that,
      # every compile silently falls back to building from source behind a
      # ::warning::. That is slower but never wrong -- the .build-inputs stamp
      # refuses a stale cache regardless, so nothing incorrect can ship either
      # way.
      #
      # If the cache is worth keeping warm, the fix is a `schedule:` trigger
      # above rather than a longer retention: a weekly run keeps it fresh inside
      # any window, where a 90-day retention just meant a 90-day-old library was
      # still sitting there waiting to be found stale.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 10
          path: apps/zonai/lib/gen/native/
