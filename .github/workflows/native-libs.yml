name: Native Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The rolling release these libraries are published to, and the one
  # compile.yml pulls them back out of. MUST match compile.yml's copy --
  # check_workflows.sh asserts they agree, because a mismatch is not an error
  # anywhere: compile.yml simply never finds the cache and quietly rebuilds
  # libsodium from source on five platforms, forever.
  NATIVE_LIBS_CACHE_TAG: native-libs-cache

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    # Ceiling, not a budget: observed max 5.5 min over 11 successful run(s)
    # sampled 2026-08-19. This one always builds from source; that is its job.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: native-libs-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: native-libs-linux-arm64
          - os: macos-latest
            artifact_name: native-libs-macos-arm64
          - os: macos-15-intel
            artifact_name: native-libs-macos-x64
            target_arch: x64
            dart_architecture: x64
          - os: windows-latest
            artifact_name: native-libs-windows-x64

    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is private.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Set up Dart
        if: matrix.dart_architecture != 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"

      - name: Set up Dart (x64)
        if: matrix.dart_architecture == 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
          architecture: x64

      - name: Get dependencies
        run: dart pub get

      - name: Install native build toolchain (Linux)
        # argon2's build hook compiles libsodium via an autoconf/make build
        # (see tool/native/argon2_builder); mirrors compile.yml's own step.
        if: runner.os == 'Linux'
        # Genuinely needed here -- this job has no pre-built-native-libraries
        # path to fall back on, so the toolchain is used rather than merely
        # installed. Still bounded: see compile.yml for the silent apt hang
        # that made an unbounded step cost 18 minutes of a release chain.
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          for tool in gcc make autoconf automake libtool m4 pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      - name: Build resqlite native library
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          mkdir -p apps/zonai/lib/gen/native
          (
            cd libs/resqlite
            dart pub get
            build_args=(--output ../../apps/zonai/lib/gen/native)
            if [ -n "$TARGET_ARCH" ]; then
              build_args+=(--arch "$TARGET_ARCH")
            fi
            dart run tool/build_native.dart "${build_args[@]}"
          )
          # The sidecar that lets compile.yml tell this artifact apart from one
          # built before the submodule pin moved. It travels in the artifact
          # because the upload below takes the whole directory.
          stamp_args=(--library resqlite)
          if [ -n "$TARGET_ARCH" ]; then
            stamp_args+=(--arch "$TARGET_ARCH")
          fi
          cd apps/zonai && dart run tool/native_build_stamp.dart write "${stamp_args[@]}"

      - name: Build Argon2 native library
        shell: bash
        # Current-platform only for now, unlike resqlite -- see
        # apps/zonai/tool/build_argon2_native.dart's comment: `dart build
        # cli` doesn't yet have an equivalent to build_native.dart's --arch
        # cross-compilation support.
        run: |
          mkdir -p apps/zonai/lib/gen/native
          cd apps/zonai
          dart run tool/build_argon2_native.dart
          dart run tool/native_build_stamp.dart write --library argon2

      # Packed here, on the runner that built them, rather than in the publish
      # job: tar preserves what the build produced instead of round-tripping
      # through an artifact upload that drops file modes.
      #
      # tar.gz rather than zip, unlike the per-version release assets: this is a
      # private cache format that only compile.yml reads, and `tar -xzf` works
      # on all three runner OSes (Windows ships bsdtar) whereas `unzip` is not
      # guaranteed on the Windows image.
      #
      # The .build-inputs stamps must travel with the libraries -- they are what
      # lets compile.yml tell this cache apart from one built before the sources
      # moved. Without them every download is refused as unvouched-for and the
      # cache does nothing at all.
      - name: Pack native libraries
        shell: bash
        run: |
          cd apps/zonai/lib/gen/native
          files=()
          for file in *.so *.dylib *.dll *.build-inputs; do
            [ -e "$file" ] && files+=("$file")
          done
          # Two libraries and two stamps. Fewer means something upstream did not
          # produce what it claims to, and shipping that as a cache would push
          # the failure into every later compile run instead of this one.
          if [ "${#files[@]}" -lt 4 ]; then
            echo "Expected 2 libraries + 2 stamps, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          echo "Packing: ${files[*]}"
          # The archive path is written by the shell, never parsed by tar.
          # $RUNNER_TEMP on Windows is `D:\a\_temp`, and GNU tar reads a leading
          # `D:` as a host:path remote spec -- it tries to resolve a machine
          # called `D` and fails with "Cannot connect to D: resolve failed".
          # GNU tar's --force-local fixes that but does not exist in the bsdtar
          # macOS ships, so the flag trades a Windows failure for a macOS one.
          # `-f -` plus a redirect is the one form all three tars agree on.
          tar -czf - "${files[@]}" > "$RUNNER_TEMP/${{ matrix.artifact_name }}.tar.gz"

      # A same-run handoff to the publish job below, which is the only thing
      # that reads it. The durable copy is the release asset it becomes.
      - name: Upload packed native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 10
          path: ${{ runner.temp }}/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  # Publishing is split out so `contents: write` is held by a job that runs no
  # build code -- it downloads artifacts and calls `gh`, nothing else. The build
  # job above runs `dart pub get`, a C toolchain and third-party build hooks,
  # and has no business holding a token that can write to the repo.
  #
  # `needs: build` means a failed platform leaves the whole cache untouched
  # rather than half-updated. That is not a correctness requirement -- each
  # target's asset is downloaded and validated independently, by its own
  # .build-inputs stamp -- but "the cache is from one run" is easier to reason
  # about than "some of it is".
  publish:
    name: Publish cache release
    needs: build
    runs-on: ubuntu-latest
    # Ceiling, not a budget: observed max 0.1 min over 1 successful run(s)
    # sampled 2026-08-19.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download packed native libraries
        uses: actions/download-artifact@v4
        with:
          path: packed
          merge-multiple: true

      # Assets are replaced in place on one rolling tag. That is the point of
      # using a release rather than an artifact: artifacts expire and had to be
      # found via "latest successful run of another workflow", while this never
      # expires, is addressed by name, and does not accumulate a fresh copy per
      # run the way a scheduled artifact upload would.
      #
      # --prerelease is load-bearing, NOT cosmetic. GitHub's /releases/latest is
      # the most recent non-draft, non-prerelease release of ANY kind, so an
      # unmarked release here would take that slot and 404 every
      # releases/latest/download link in the docs -- exactly what
      # zonai_schema-v0.1.0 did on 2026-08-10. The CLI's own resolution is
      # already safe either way (versions.dart and latest_cli_release_tag.sh
      # both require a `v<semver>` tag AND skip prereleases), but the docs links
      # go through GitHub's endpoint directly and have no such filter.
      - name: Publish to the cache release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${NATIVE_LIBS_CACHE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${NATIVE_LIBS_CACHE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Native library build cache" \
              --prerelease \
              --notes "Prebuilt resqlite and Argon2 libraries that compile.yml reuses instead of rebuilding libsodium from source on every run.

          Not a zonai release. Nothing here is installable and the tag does not point at meaningful source -- assets are replaced in place by the Native Libraries workflow. Each archive carries a \`.build-inputs\` stamp; compile.yml refuses any whose stamp does not match the sources in its checkout, so a stale cache costs build time and never correctness."
          fi

          gh release upload "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            packed/*.tar.gz

          echo "Published $(ls packed/*.tar.gz | wc -l | tr -d ' ') archive(s) to ${NATIVE_LIBS_CACHE_TAG}."
