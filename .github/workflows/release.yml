name: Release

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [Verify Release]
  #   types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  package-fat-binary:
    name: Package fat binary (macOS + Linux)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering verify run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      - name: Download compile artifacts (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          path: artifacts

      - name: Package fat binary
        run: bash tool/ci/package_fat_binary.sh artifacts release-assets

      # A handoff between two jobs in this same run: the release job downloads it
      # moments later and publishes it as a release asset. Nothing reads it
      # across runs, so its useful life is the length of one workflow.
      - name: Upload fat binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zonai-fat-binary
          retention-days: 10
          path: release-assets/zonai

  release:
    needs: package-fat-binary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering verify run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      - name: Download compile artifacts (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          path: artifacts

      - name: Download fat binary artifact
        uses: actions/download-artifact@v4
        with:
          name: zonai-fat-binary
          path: release-assets

      - name: Package release assets
        run: bash tool/ci/package_release_assets.sh artifacts

      # The `native-libs-embedded-*` artifacts arrive with the compile
      # download above (it pulls the whole run, not one named artifact), so
      # these are the libraries those exact binaries embedded.
      - name: Package native library assets
        run: bash tool/ci/package_native_lib_assets.sh artifacts release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists" >&2
            exit 1
          fi
          # --latest explicitly: GitHub otherwise picks "Latest" by date, and
          # this repo also publishes per-package releases
          # (zonai_schema-v*, zonai_client-v*). One of those became Latest on
          # 2026-08-10, and since it carries no assets it silently broke every
          # `releases/latest/download/...` install link in the docs and the
          # CLI's own update check.
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zonai ${tag}" \
            --latest \
            --generate-notes \
            release-assets/zonai-linux-x64.zip \
            release-assets/zonai-linux-arm64.zip \
            release-assets/zonai-macos-arm64.zip \
            release-assets/zonai-macos-x64.zip \
            release-assets/zonai-windows-x64.zip \
            release-assets/native-libs-linux-x64.zip \
            release-assets/native-libs-linux-arm64.zip \
            release-assets/native-libs-macos-arm64.zip \
            release-assets/native-libs-macos-x64.zip \
            release-assets/native-libs-windows-x64.zip \
            release-assets/zonai

      # `zonai build` resolves these by exact name against the release for a
      # pinned version (see Versions._findAsset), and a missing one surfaces
      # only when somebody cross-builds for that target -- possibly long after
      # the release. Assert the set here, where the release was just made.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          assets="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          missing=0
          for target in linux-x64 linux-arm64 macos-arm64 macos-x64 windows-x64; do
            for prefix in zonai native-libs; do
              if ! grep -qx "${prefix}-${target}.zip" <<<"${assets}"; then
                echo "missing release asset: ${prefix}-${target}.zip" >&2
                missing=1
              fi
            done
          done
          if ! grep -qx "zonai" <<<"${assets}"; then
            echo "missing release asset: zonai (fat binary)" >&2
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1
          echo "All 11 release assets present on ${tag}."

      - name: Commit release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "Version files already at v${VERSION}, skipping commit"
          else
            git commit -m "chore: release v${VERSION}"
            git push origin HEAD
          fi

  # Republish both sites against the release commit. They read VERSION, so the
  # version badge, the install command and every download URL follow the tag
  # that was just cut.
  #
  # Called rather than left to a `push` trigger on VERSION: the commit above is
  # made with GITHUB_TOKEN, and GitHub deliberately does not start new workflow
  # runs from those pushes. `ref: main` picks up that commit, which is newer
  # than the SHA this run started on.
  deploy-website:
    name: Publish zonai.dev
    needs: release
    # A called workflow is capped by the caller's grant, and this one deploys to
    # our own Pages — without these two it fails at actions/deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: main
    secrets: inherit

  deploy-docs:
    name: Publish docs.zonai.dev
    needs: release
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: main
    secrets: inherit
