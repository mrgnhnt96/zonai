name: Release

on:
  # The deliberate override, not the only door. `force` is what lets a dispatch
  # publish past a gate that is not green -- and it is recorded in the job
  # summary when it does, because an override that leaves no trace is how the
  # next bumpy release happens. A dispatch of an already-green commit needs
  # nothing; making `force` habitual would defeat it.
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Publish even if Test is not green for this commit. Test now carries
          the five-platform release verification too, so this is the whole gate.
          Recorded loudly in the job summary.
        type: boolean
        default: false
  # The happy path, and it hangs off ONE workflow on purpose.
  #
  # This was commented out entirely at one point, leaving workflow_dispatch as
  # the only door -- so Verify Release ran BESIDE publication rather than before
  # it, and nothing stopped a human dispatching Release while it was red or had
  # never run. See docs/testing-strategy.md Step 5, and the release-gate job
  # below, which is what actually enforces the ordering: this trigger only makes
  # the correct order the default one.
  #
  # WHY THERE IS ONLY ONE NAME HERE NOW. The release requires two things to be
  # green -- the suite, and the five-platform artifact verification -- and they
  # used to be two workflows that Compile fanned out to in parallel. A
  # `workflow_run` trigger cannot say "whichever of these finishes last", so
  # this listed BOTH: the loser fired an attempt that the gate refused as "the
  # other one is still running", and every release therefore produced one red
  # Release run BY DESIGN. Documenting that red as noise is exactly how a red
  # run that is NOT noise stops being read.
  #
  # verify-release.yml is now a reusable workflow that test.yml calls (see the
  # `verify-release` job there), so there is one prerequisite workflow, one
  # trigger, and one attempt. A red Release run now means the release did not
  # happen. Nothing about the schedule changed -- the verify jobs still run
  # concurrently, just inside Test's run.
  #
  # This does not widen what may publish. The gate below still asks the runs API
  # for a completed, successful Test run at this exact sha; the trigger only
  # decides when the question is asked, never how it is answered.
  #
  # `branches` is load-bearing: test.yml ALSO runs on `pull_request`, so without
  # this filter every owner PR's Test run would fire a Release attempt. Each
  # would be refused (the gate checks the branch), but they would be refused
  # loudly, on every PR, and a red Release run that means nothing is how a red
  # Release run that means something stops being read. The filter reads the
  # TRIGGERING run's head_branch, which for a PR-triggered Test is the PR's own
  # branch and never `main`.
  #
  # Spelled literally because a trigger filter cannot take an expression; the
  # gate's own RELEASE_GATE_DEFAULT_BRANCH is the other place this name lives.
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  # NOTHING IN THIS FILE MAY RUN BEFORE THIS JOB. It asks the one question the
  # trigger cannot answer -- "is Test green for the exact commit I am about to
  # publish?" -- by querying the runs API for that sha,
  # rather than inferring it from `workflow_run` ordering, which is what
  # produced the bug this closes.
  #
  # Every job below reaches it through `needs:` -- package-fat-binary directly,
  # the rest transitively through it -- and a job that needs a failed job is
  # skipped unless its `if:` uses a status function (`always()`, `failure()`,
  # `cancelled()`). None of the conditions in this file do, so a refusal here
  # skips the entire chain rather than merely failing beside it. Adding
  # `always()` to any `if:` below would silently reopen the door.
  release-gate:
    name: Require a green Test run for this commit
    runs-on: ubuntu-latest
    # Ceiling, not a budget: observed max 0.2 min over 2 successful run(s)
    # sampled 2026-08-19.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # No submodules and no PAT: this job reads one script and the GitHub API.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the release gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same sha the artifact downloads below pin themselves to. On the
          # automatic path that is the commit Compile built and Test verified
          # -- NOT `github.sha`, which on a `workflow_run` event is the default
          # branch head and may have moved since.
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_GATE_EVENT: ${{ github.event_name }}
          RELEASE_GATE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_GATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Empty on the workflow_run path, which carries no inputs -- and the
          # script refuses to honour it there even if something sets it.
          RELEASE_GATE_FORCE: ${{ inputs.force }}
        run: bash tool/ci/check_release_gates.sh

      # A release ships a short bulleted summary of what it contains, and this
      # is where a missing one becomes a refusal rather than a blank release
      # page. It sits in the GATE job on purpose: everything else in this file
      # reaches the gate through `needs:`, so refusing here skips the whole
      # chain instead of failing beside a tag that already exists. The check
      # itself is two seconds of awk -- the cost of putting it last would be a
      # release that published, then complained.
      - name: Require a summary for this release
        run: bash tool/ci/release_notes.sh check

  package-fat-binary:
    name: Package fat binary (macOS + Linux)
    needs: release-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Ceiling, not a budget: observed max 1.6 min over 2 successful run(s)
    # sampled 2026-08-19.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # `submodules: recursive` is not optional here even though this job only
      # runs a version check: the root pubspec declares `resolution: workspace`,
      # so `dart pub get` resolves every member -- including apps/zonai, which
      # depends on `resqlite` by path. Without the submodule that path has no
      # pubspec and resolution fails outright ("No pubspec.yaml found for
      # package resqlite"), before the check this job exists for ever runs.
      # Cost a release on 2026-08-13, run 31746052351.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      # The CLI cannot ship ahead of the zonai_schema floor it declares, and
      # the floor is only reachable if the PUBLISHED zonai_client admits it
      # too. Neither is visible from the test suites -- every checkout here
      # resolves zonai_schema by path, and the constraints that bind consumers
      # are the ones already on pub.dev. See docs/releasing.md.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify the zonai_schema floor is reachable by a consumer
        working-directory: apps/zonai
        run: dart pub get && dart run tool/verify_release_coupling.dart

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering test run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      # `commit:` is what makes this safe, and its absence cost a release.
      # Without it this takes the newest successful Compile run of ANY commit,
      # so a manual dispatch happily packages binaries built weeks earlier and
      # publishes them under today's version. That is exactly what v0.6.3 did:
      # it shipped artifacts from c684ed28 (2026-08-12), so the released binary
      # reported 0.6.2, and the post-release cross-build then failed running
      # that stale binary against a freshly published zonai_schema.
      #
      # Pinned to the dispatched SHA, this now fails outright when no
      # successful Compile exists for this commit -- the correct outcome, and
      # loud. Run Compile on this ref first, then dispatch Release.
      - name: Download compile artifacts (this commit)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          path: artifacts

      - name: Package fat binary
        run: bash tool/ci/package_fat_binary.sh artifacts release-assets

      # A handoff between two jobs in this same run: the release job downloads it
      # moments later and publishes it as a release asset. Nothing reads it
      # across runs, so its useful life is the length of one workflow.
      - name: Upload fat binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zonai-fat-binary
          retention-days: 10
          path: release-assets/zonai

  release:
    needs: package-fat-binary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Ceiling, not a budget: observed max 0.7 min over 2 successful run(s)
    # sampled 2026-08-19. Deliberately loose for its size: this job creates the tag and uploads 11 assets, and a timeout landing mid-publish is worse than a slow one.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering test run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      # `commit:` is what makes this safe, and its absence cost a release.
      # Without it this takes the newest successful Compile run of ANY commit,
      # so a manual dispatch happily packages binaries built weeks earlier and
      # publishes them under today's version. That is exactly what v0.6.3 did:
      # it shipped artifacts from c684ed28 (2026-08-12), so the released binary
      # reported 0.6.2, and the post-release cross-build then failed running
      # that stale binary against a freshly published zonai_schema.
      #
      # Pinned to the dispatched SHA, this now fails outright when no
      # successful Compile exists for this commit -- the correct outcome, and
      # loud. Run Compile on this ref first, then dispatch Release.
      - name: Download compile artifacts (this commit)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          path: artifacts

      - name: Download fat binary artifact
        uses: actions/download-artifact@v4
        with:
          name: zonai-fat-binary
          path: release-assets

      - name: Package release assets
        run: bash tool/ci/package_release_assets.sh artifacts

      # The `native-libs-embedded-*` artifacts arrive with the compile
      # download above (it pulls the whole run, not one named artifact), so
      # these are the libraries those exact binaries embedded.
      - name: Package native library assets
        run: bash tool/ci/package_native_lib_assets.sh artifacts release-assets

      # The description, built BEFORE the release exists -- latest_cli_release_tag.sh
      # reads the newest CLI release, which is the PREVIOUS one only while this
      # one is unpublished. Run after the create step and the compare link would
      # point a release at itself.
      - name: Render the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          prev="$(bash tool/ci/latest_cli_release_tag.sh "${GITHUB_REPOSITORY}")"
          bash tool/ci/release_notes.sh body "v${VERSION}" "${prev}" \
            "${GITHUB_REPOSITORY}" > release-notes.txt
          echo "Publishing v${VERSION} with:" >> "${GITHUB_STEP_SUMMARY}"
          {
            echo '```markdown'
            cat release-notes.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists" >&2
            exit 1
          fi
          # --latest explicitly: GitHub otherwise picks "Latest" by date, and
          # this repo also publishes per-package releases
          # (zonai_schema-v*, zonai_client-v*). One of those became Latest on
          # 2026-08-10, and since it carries no assets it silently broke every
          # `releases/latest/download/...` install link in the docs and the
          # CLI's own update check.
          #
          # --notes-file, not --generate-notes. Generated notes are a compare
          # link and nothing else on a repo that commits to main, which is what
          # every release through v0.8.4 published as its entire description.
          # The file carries the summary a human wrote plus that same link; see
          # tool/ci/release_notes.sh for why the body is built here rather than
          # left to whichever gh the runner ships.
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zonai ${tag}" \
            --latest \
            --notes-file release-notes.txt \
            release-assets/zonai-linux-x64.zip \
            release-assets/zonai-linux-arm64.zip \
            release-assets/zonai-macos-arm64.zip \
            release-assets/zonai-macos-x64.zip \
            release-assets/zonai-windows-x64.zip \
            release-assets/native-libs-linux-x64.zip \
            release-assets/native-libs-linux-arm64.zip \
            release-assets/native-libs-macos-arm64.zip \
            release-assets/native-libs-macos-x64.zip \
            release-assets/native-libs-windows-x64.zip \
            release-assets/zonai

      # `zonai build` resolves these by exact name against the release for a
      # pinned version (see Versions._findAsset), and a missing one surfaces
      # only when somebody cross-builds for that target -- possibly long after
      # the release. Assert the set here, where the release was just made.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          assets="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          missing=0
          for target in linux-x64 linux-arm64 macos-arm64 macos-x64 windows-x64; do
            for prefix in zonai native-libs; do
              if ! grep -qx "${prefix}-${target}.zip" <<<"${assets}"; then
                echo "missing release asset: ${prefix}-${target}.zip" >&2
                missing=1
              fi
            done
          done
          if ! grep -qx "zonai" <<<"${assets}"; then
            echo "missing release asset: zonai (fat binary)" >&2
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1
          echo "All 11 release assets present on ${tag}."

      - name: Commit release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "Version files already at v${VERSION}, skipping commit"
          else
            git commit -m "chore: release v${VERSION}"
            git push origin HEAD
          fi

  # WHERE THE POST-RELEASE CROSS-TARGET CHECK WENT.
  # `cross-build-linux-x64 (released)` and `cross-run-linux-x64 (released)`
  # used to live here as `needs: release`. They verify the artifact people
  # actually download -- `zonai build` fetching this version's native libraries
  # from the release that was just cut -- so they cannot run before publication
  # and their failure is not a failure of the release.
  #
  # Sitting in this file, that distinction was invisible: a red cross-target
  # job made the whole Release run red after the tag, the eleven assets and the
  # VERSION commit had all landed correctly. They now live in
  # .github/workflows/post-release-verify.yml, triggered by a successful run of
  # THIS workflow, so a Release verdict means "this version published" and
  # nothing else.
  #
  # That workflow is the third link in a workflow_run chain and GitHub's limit
  # is three, so anything inserted ahead of Release here stops it firing --
  # silently. It also takes a workflow_dispatch, which is both the fallback and
  # the way to re-run it after a fix.

  # Republish both sites against the release commit. They read VERSION, so the
  # version badge, the install command and every download URL follow the tag
  # that was just cut.
  #
  # Called rather than left to a `push` trigger on VERSION: the commit above is
  # made with GITHUB_TOKEN, and GitHub deliberately does not start new workflow
  # runs from those pushes. `ref: main` picks up that commit, which is newer
  # than the SHA this run started on.
  deploy-website:
    name: Publish zonai.dev
    needs: release
    # A called workflow is capped by the caller's grant, and this one deploys to
    # our own Pages — without these two it fails at actions/deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: main
    secrets: inherit

  deploy-docs:
    name: Publish docs.zonai.dev
    needs: release
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: main
    secrets: inherit
