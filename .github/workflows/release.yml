name: Release

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [Verify Release]
  #   types: [completed]

permissions:
  contents: write
  actions: read

env:
  # Third declarer of this string, after compile.yml and native-libs.yml --
  # cross-target-build restores the same prebuilt libraries to generate the
  # native byte bindings. check_workflows.sh asserts all three agree; it names
  # exactly which files may declare it, so adding a fourth means updating that
  # list too.
  NATIVE_LIBS_CACHE_TAG: native-libs-cache

jobs:
  package-fat-binary:
    name: Package fat binary (macOS + Linux)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # `submodules: recursive` is not optional here even though this job only
      # runs a version check: the root pubspec declares `resolution: workspace`,
      # so `dart pub get` resolves every member -- including apps/zonai, which
      # depends on `resqlite` by path. Without the submodule that path has no
      # pubspec and resolution fails outright ("No pubspec.yaml found for
      # package resqlite"), before the check this job exists for ever runs.
      # Cost a release on 2026-08-13, run 31746052351.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      # The CLI cannot ship ahead of the zonai_schema floor it declares, and
      # the floor is only reachable if the PUBLISHED zonai_client admits it
      # too. Neither is visible from the test suites -- every checkout here
      # resolves zonai_schema by path, and the constraints that bind consumers
      # are the ones already on pub.dev. See docs/releasing.md.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify the zonai_schema floor is reachable by a consumer
        working-directory: apps/zonai
        run: dart pub get && dart run tool/verify_release_coupling.dart

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering verify run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      # `commit:` is what makes this safe, and its absence cost a release.
      # Without it this takes the newest successful Compile run of ANY commit,
      # so a manual dispatch happily packages binaries built weeks earlier and
      # publishes them under today's version. That is exactly what v0.6.3 did:
      # it shipped artifacts from c684ed28 (2026-08-12), so the released binary
      # reported 0.6.2, and the post-release cross-build then failed running
      # that stale binary against a freshly published zonai_schema.
      #
      # Pinned to the dispatched SHA, this now fails outright when no
      # successful Compile exists for this commit -- the correct outcome, and
      # loud. Run Compile on this ref first, then dispatch Release.
      - name: Download compile artifacts (this commit)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          path: artifacts

      - name: Package fat binary
        run: bash tool/ci/package_fat_binary.sh artifacts release-assets

      # A handoff between two jobs in this same run: the release job downloads it
      # moments later and publishes it as a release asset. Nothing reads it
      # across runs, so its useful life is the length of one workflow.
      - name: Upload fat binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zonai-fat-binary
          retention-days: 10
          path: release-assets/zonai

  release:
    needs: package-fat-binary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      - name: Download compile artifacts (triggering verify run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.event.workflow_run.head_sha }}
          path: artifacts

      # `commit:` is what makes this safe, and its absence cost a release.
      # Without it this takes the newest successful Compile run of ANY commit,
      # so a manual dispatch happily packages binaries built weeks earlier and
      # publishes them under today's version. That is exactly what v0.6.3 did:
      # it shipped artifacts from c684ed28 (2026-08-12), so the released binary
      # reported 0.6.2, and the post-release cross-build then failed running
      # that stale binary against a freshly published zonai_schema.
      #
      # Pinned to the dispatched SHA, this now fails outright when no
      # successful Compile exists for this commit -- the correct outcome, and
      # loud. Run Compile on this ref first, then dispatch Release.
      - name: Download compile artifacts (this commit)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          path: artifacts

      - name: Download fat binary artifact
        uses: actions/download-artifact@v4
        with:
          name: zonai-fat-binary
          path: release-assets

      - name: Package release assets
        run: bash tool/ci/package_release_assets.sh artifacts

      # The `native-libs-embedded-*` artifacts arrive with the compile
      # download above (it pulls the whole run, not one named artifact), so
      # these are the libraries those exact binaries embedded.
      - name: Package native library assets
        run: bash tool/ci/package_native_lib_assets.sh artifacts release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists" >&2
            exit 1
          fi
          # --latest explicitly: GitHub otherwise picks "Latest" by date, and
          # this repo also publishes per-package releases
          # (zonai_schema-v*, zonai_client-v*). One of those became Latest on
          # 2026-08-10, and since it carries no assets it silently broke every
          # `releases/latest/download/...` install link in the docs and the
          # CLI's own update check.
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zonai ${tag}" \
            --latest \
            --generate-notes \
            release-assets/zonai-linux-x64.zip \
            release-assets/zonai-linux-arm64.zip \
            release-assets/zonai-macos-arm64.zip \
            release-assets/zonai-macos-x64.zip \
            release-assets/zonai-windows-x64.zip \
            release-assets/native-libs-linux-x64.zip \
            release-assets/native-libs-linux-arm64.zip \
            release-assets/native-libs-macos-arm64.zip \
            release-assets/native-libs-macos-x64.zip \
            release-assets/native-libs-windows-x64.zip \
            release-assets/zonai

      # `zonai build` resolves these by exact name against the release for a
      # pinned version (see Versions._findAsset), and a missing one surfaces
      # only when somebody cross-builds for that target -- possibly long after
      # the release. Assert the set here, where the release was just made.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          assets="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          missing=0
          for target in linux-x64 linux-arm64 macos-arm64 macos-x64 windows-x64; do
            for prefix in zonai native-libs; do
              if ! grep -qx "${prefix}-${target}.zip" <<<"${assets}"; then
                echo "missing release asset: ${prefix}-${target}.zip" >&2
                missing=1
              fi
            done
          done
          if ! grep -qx "zonai" <<<"${assets}"; then
            echo "missing release asset: zonai (fat binary)" >&2
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1
          echo "All 11 release assets present on ${tag}."

      - name: Commit release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "Version files already at v${VERSION}, skipping commit"
          else
            git commit -m "chore: release v${VERSION}"
            git push origin HEAD
          fi

  # The half of the cross-target gate that cannot run before this point.
  # verify-release.yml builds the same bundle and runs it on Linux, but the
  # libraries `zonai build` fetches come from the release for THIS version, so
  # before the release exists there is nothing to fetch and that job checks
  # everything except the fetch. Here the assets exist, REQUIRE_NATIVE_LIBS
  # makes their absence a failure, and what gets checked is the artifact people
  # actually download rather than one assembled from compile artifacts.
  #
  # It runs after the release rather than gating it: a regression here means
  # re-cutting a patch, which is the price of the fetch being release-shaped.
  cross-target-build:
    name: cross-build-linux-x64 (released)
    needs: release
    runs-on: macos-latest

    steps:
      # ref: main for the same reason deploy-website uses it -- the release job
      # commits VERSION, and the stamp this checks must be the released one.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Configure revali git overrides
        shell: bash
        run: |
          bash tool/ci/use_revali_git_overrides.sh
          bash tool/ci/use_revali_git_overrides.sh e2e/build_smoke

      - name: Get dependencies
        run: dart pub get

      # `apps/zonai/lib/gen/` is gitignored and produced by compile.yml, so a
      # plain checkout does not have it. This job needs it anyway, because
      # `zonai build` links the smoke project against apps/zonai's own sources
      # (resolveProjectLink's merged package_config), so the AOT compile reads
      # those files directly -- it failed on a missing `kVersion` and missing
      # `*_native.g.dart` byte bindings, which is what this step exists to
      # prevent. Passed on v0.6.2 and broke here, so it is fragile rather than
      # new: nothing pinned the requirement, it was just incidentally
      # satisfied before.
      - name: Generate lib/gen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Inlined from scripts.yaml's `version.gen` rather than shelled out,
          # so this does not depend on sip being activated -- and deliberately
          # NOT resolve_release_version.sh, which would *bump* the version
          # (VERSION now equals the tag, so it would resolve to a new minor).
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p apps/zonai/lib/gen
          echo "const kVersion = \"${VERSION}\";" > apps/zonai/lib/gen/version.dart
          echo "kVersion = ${VERSION}"

          # The native byte bindings, from the same cache release compile.yml
          # reads. With the libraries present, ZONAI_SKIP_NATIVE_BUILD makes
          # the gen scripts emit the .g.dart wrappers without rebuilding
          # libsodium from source.
          mkdir -p apps/zonai/lib/gen/native
          archive="native-libs-macos-arm64.tar.gz"
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"

          dart pub global activate sip_cli >/dev/null
          export ZONAI_SKIP_NATIVE_BUILD=true
          dart pub global run sip_cli:sip run resqlite gen
          dart pub global run sip_cli:sip run argon2 gen
          ls -la apps/zonai/lib/gen apps/zonai/lib/gen/native

      - name: Download the released macOS arm64 binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release download "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'zonai-macos-arm64.zip' \
            --dir .
          mkdir -p build
          unzip -o zonai-macos-arm64.zip -d build
          chmod +x build/zonai

      # No probe is built here: this checkout has never run the native library
      # generators, so apps/zonai/lib/gen/native is empty. cross_target_build.sh
      # says so and the run half skips its controls by name -- they are covered
      # pre-release, where that directory is populated from compile artifacts.
      - name: Build a linux/x64 bundle from the released binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_NATIVE_LIBS: "1"
        run: |
          bash tool/ci/cross_target_build.sh \
            build/zonai linux x64 e2e/build_smoke cross-target-out

      # See the note on the same step in verify-release.yml: the bundle is all
      # dot-directories, which upload-artifact drops unless told otherwise.
      - name: Upload the released cross-target bundle
        uses: actions/upload-artifact@v4
        with:
          name: cross-target-linux-x64-released
          retention-days: 10
          path: cross-target-out
          include-hidden-files: true
          if-no-files-found: error

  cross-target-run:
    name: cross-run-linux-x64 (released)
    needs: cross-target-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the released cross-target bundle
        uses: actions/download-artifact@v4
        with:
          name: cross-target-linux-x64-released
          path: cross-target-out

      - name: Run the macOS-built bundle on linux/x64
        shell: bash
        run: |
          bash tool/ci/verify_cross_target_bundle.sh \
            cross-target-out/bundle \
            - \
            cross-target-out/VERSION

  # Republish both sites against the release commit. They read VERSION, so the
  # version badge, the install command and every download URL follow the tag
  # that was just cut.
  #
  # Called rather than left to a `push` trigger on VERSION: the commit above is
  # made with GITHUB_TOKEN, and GitHub deliberately does not start new workflow
  # runs from those pushes. `ref: main` picks up that commit, which is newer
  # than the SHA this run started on.
  deploy-website:
    name: Publish zonai.dev
    needs: release
    # A called workflow is capped by the caller's grant, and this one deploys to
    # our own Pages — without these two it fails at actions/deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: main
    secrets: inherit

  deploy-docs:
    name: Publish docs.zonai.dev
    needs: release
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: main
    secrets: inherit
