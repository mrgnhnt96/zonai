name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "pubspec_overrides.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Configure revali git overrides
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Get dependencies
        run: dart pub get

      - name: Configure GitHub Pages base path
        run: |
          printf '\nbase: /%s/\n' "${{ github.event.repository.name }}" >> apps/docs/content/_data/site.yaml

      - name: Build docs
        working-directory: apps/docs
        run: dart run jaspr_cli:jaspr build --verbose

      - name: Rewrite absolute URLs for GitHub Pages
        working-directory: apps/docs
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          find build/jaspr -name '*.html' -print0 |
            xargs -0 sed -i \
              -e "s|href=\"/|href=\"${BASE_PATH}/|g" \
              -e "s|src=\"/|src=\"${BASE_PATH}/|g"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build/jaspr

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
