name: Compile

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # MUST match native-libs.yml's copy -- check_workflows.sh asserts they agree.
  # A mismatch raises no error anywhere: the download below just never finds the
  # cache, and every compile quietly rebuilds libsodium from source instead.
  NATIVE_LIBS_CACHE_TAG: native-libs-cache

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/resolve_release_version.sh

      # Every artifact this workflow produces is a step on the way to a release,
      # and the release is the durable copy -- the binaries become release
      # assets, the embedded libraries become native-libs-*.zip, and VERSION
      # lands in the `chore: release` commit. Keeping them for the 90-day
      # default is paying to store a second copy of something already published.
      #
      # 10 days is chosen to outlast the gap between a compile run and the
      # release that consumes it, which is normally minutes and has never been
      # days. What it costs: release.yml and verify-release.yml resolve compile
      # artifacts by "latest successful run" with no commit filter, so a compile
      # older than 10 days can no longer be released or verified from -- re-run
      # compile.yml instead, which is the right move at that age anyway.
      - name: Upload release version files
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          retention-days: 10
          path: |
            VERSION
            apps/zonai/lib/gen/version.dart

  compile:
    name: ${{ matrix.artifact_name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zonai-linux-x64
            target: linux-x64
            output_name: zonai
            native_libs_artifact: native-libs-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: zonai-linux-arm64
            target: linux-arm64
            output_name: zonai
            native_libs_artifact: native-libs-linux-arm64
          - os: macos-latest
            artifact_name: zonai-macos-arm64
            target: macos-arm64
            output_name: zonai
            native_libs_artifact: native-libs-macos-arm64
          - os: macos-15-intel
            artifact_name: zonai-macos-x64
            target: macos-x64
            output_name: zonai
            target_arch: x64
            dart_architecture: x64
            native_libs_artifact: native-libs-macos-x64
          - os: windows-latest
            artifact_name: zonai-windows-x64
            target: windows-x64
            output_name: zonai.exe
            native_libs_artifact: native-libs-windows-x64

    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is private.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Download release version files
        uses: actions/download-artifact@v4
        with:
          name: release-version

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Set up Dart
        if: matrix.dart_architecture != 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Set up Dart (x64)
        if: matrix.dart_architecture == 'x64'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"
          architecture: x64

      - name: Install sip
        # Temporary: install from GitHub until a pub.dev release is pinned.
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Get dependencies
        run: dart pub get

      - name: Install native build toolchain (Linux)
        # argon2.gen compiles libsodium via an autoconf/make build (see
        # tool/native/argon2_builder); confirmed via a bare `dart:stable`
        # container that build-essential alone isn't enough -- it also
        # needs autoconf/automake/libtool/m4. ubuntu-latest may already
        # have these, but installing explicitly removes the ambiguity
        # rather than hoping the runner image includes them.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      # Native libraries (resqlite, Argon2) rarely change and are slow to
      # build from source on every compile run -- Argon2 means compiling
      # libsodium through autoconf. They come from the rolling cache release
      # the Native Libraries workflow publishes; `resqlite.gen`/`argon2.gen`
      # (invoked below via `zonai compile`) fall back to building from source
      # when ZONAI_SKIP_NATIVE_BUILD isn't "true" -- which covers a failed
      # download here, the bootstrapping case where the cache release does not
      # exist yet, and a cache whose .build-inputs stamp no longer matches
      # this checkout.
      #
      # A release rather than the previous "latest successful run of
      # native-libs.yml" artifact: artifacts expire, so the cache silently went
      # cold on a timer, and resolving one workflow's artifacts from another is
      # a lookup with no commit filter and an `actions: read` scope. A release
      # asset is addressed by name, never expires, and is replaced in place.
      - name: Download pre-built native libraries (cache release)
        id: download-native-libs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${{ matrix.native_libs_artifact }}.tar.gz"
          mkdir -p apps/zonai/lib/gen/native
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          # Read through the shell for the same reason native-libs.yml writes
          # that way: `D:\a\_temp` on Windows parses as a host:path remote spec
          # in GNU tar, and GNU tar's --force-local does not exist in the bsdtar
          # macOS ships. This side has never been reached on Windows, because
          # the cache release did not exist and every run took the miss path --
          # it would have failed on the first Windows compile after the cache
          # was populated.
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"
          echo "Restored ${archive} from ${NATIVE_LIBS_CACHE_TAG}:"
          ls -la apps/zonai/lib/gen/native

      - name: Check downloaded native libraries
        id: native-libs
        shell: bash
        run: |
          # "found" only means bytes arrived. Whether they are the RIGHT bytes is
          # decided later by native_build_stamp.dart's `check`, inside
          # resqlite.gen/argon2.gen -- which is why this can stay a presence
          # test without being the kind of existence check that used to let a
          # stale library ship.
          if [ "${{ steps.download-native-libs.outcome }}" = "success" ] && \
             [ -n "$(ls -A apps/zonai/lib/gen/native 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using pre-built native libraries from ${NATIVE_LIBS_CACHE_TAG}."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${{ matrix.native_libs_artifact }}.tar.gz in the ${NATIVE_LIBS_CACHE_TAG} release (or the download failed) -- building resqlite/Argon2 from source instead. Run the 'Native Libraries' workflow once to populate the cache."
          fi

      - name: Build zonai
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          ZONAI_SKIP_NATIVE_BUILD: ${{ steps.native-libs.outputs.found }}
        # Use `dart pub global run` so Windows Git Bash finds sip (global stubs are .bat-only).
        run: |
          mkdir -p build-logs
          set -o pipefail
          dart pub global run sip_cli:sip run zonai compile 2>&1 | tee build-logs/compile.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # See the retention note on "Upload release version files".
          retention-days: 10
          path: build/${{ matrix.output_name }}

      # The shared libraries this binary embedded, shipped as their own
      # release assets by release.yml. `dart compile exe --target-os` does not
      # cross-compile embedded native-library bytes, so a cross-target
      # `zonai build` needs correct ones for its target from somewhere; these
      # are that somewhere.
      #
      # Uploaded from *this* run rather than read off native-libs.yml later:
      # whether the step above downloaded them or fell back to building from
      # source, what sits here is exactly what went into the binary. Since a
      # library placed on disk overrides the embedded copy, shipping a pair
      # that disagrees would fail silently and at runtime.
      #
      # The globs stay at this directory level on purpose -- they exclude the
      # multi-megabyte *.g.dart byte arrays, and the nested build cache dir
      # that resqlite's builder leaves behind next to its output.
      - name: Upload embedded native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-embedded-${{ matrix.target }}
          # See the retention note on "Upload release version files". These are
          # the shortest-lived of the set: release.yml repackages them as
          # native-libs-<os>-<arch>.zip in the same release the binaries go to.
          retention-days: 10
          path: |
            apps/zonai/lib/gen/native/*.so
            apps/zonai/lib/gen/native/*.dylib
            apps/zonai/lib/gen/native/*.dll
          if-no-files-found: error

      # Temporary: capture full build output for debugging CI failures.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build-log
          # Debugging output for a run someone is actively looking at. Nobody
          # opens a build log from a month ago.
          retention-days: 10
          path: |
            build-logs/
            build/logs/
          if-no-files-found: warn
