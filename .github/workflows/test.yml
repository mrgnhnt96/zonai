name: Test

# The first CI job that runs zonai's own tests. Before this file, exactly one
# `dart test` existed across all six workflows -- deploy-docs.yml:95, scoped to
# apps/docs. The 504-test suite covering the product had never executed on CI
# hardware, and had never executed on Windows at all. See
# docs/testing-strategy.md Step 4.
#
# One job per layer, matching the `test` targets in scripts.yaml exactly. The
# jobs do NOT re-state what a suite is or which prerequisites it carries --
# scripts.yaml owns that, so `sip run test unit` means the same thing on a
# laptop and on a runner. A job here that inlined `dart test` paths would be a
# second definition free to drift from the first, which is the failure mode the
# entrypoints were added to close.
#
# WHAT IS EXPECTED TO BE RED WHEN THIS LANDS, and why it is not being hidden:
#
#   THE PATTERN, now that a runner has finally answered: every prediction below
#   that was "measured green" was measured on a DEV MACHINE, and the two that
#   mattered were both wrong. This file's first real run (2026-08-14, run
#   31830243531) failed 12/12. A local measurement of a CI claim is a
#   hypothesis. Nothing here counts as verified until a run id can be cited.
#
#   static  -- WAS "no longer expected red". It was red. The prediction was
#              superseded twice, and both supersessions are kept rather than
#              deleted, because the SECOND one repeated the mistake of the
#              first with a different file:
#                * the 388-file format drift was cleared (8dc4922) and the
#                  check narrowed to what humans write (8f584b3);
#                * "`dart analyze .` is clean" was true only of a DEV MACHINE.
#                  Measured from a tree with no .dart_tool anywhere and root
#                  `dart pub get` only, it was 226 errors, 224 of them merely
#                  unresolved imports in the nine packages outside the pub
#                  workspace. scripts.yaml `test static` now resolves those.
#                * ...and that fix was declared complete while the SAME class
#                  of machine-local state was still load-bearing one directory
#                  over: apps/zonai/lib/gen is gitignored and tracked nowhere,
#                  so the runner had none of it. 141 issues, 79 errors, 75 of
#                  them nothing but the missing tree. "It looked clean locally
#                  purely because of leftover gitignored state" was written
#                  about .dart_tool and was simultaneously true of lib/gen.
#              This job therefore now restores native libs, runs
#              `bootstrap test` and writes the web-asset stub before analyzing.
#              The older note here said "no step is needed -- do not add one":
#              that was about not RESTATING what the suite is, which still
#              holds (the check is still exactly `sip run test static`). It was
#              never about prerequisites, which unit/cli/e2e all provision as
#              steps in this file, and which cannot move into scripts.yaml
#              anyway -- the native-libs restore needs `gh release download`
#              and a token, and no laptop should build libsodium from C source
#              to answer "does this analyze".
#   e2e     -- WAS "LIVE ... this no longer exits 70". It exited 70, on all
#              three OSes, before a single assertion ran: run_e2e.sh drives a
#              REAL compiled binary and no step in this job built one. The
#              local proof came from a tree that already had build/zonai. So
#              between bdaa61d and 2026-08-14 this job ran ZERO e2e tests while
#              being recorded, here and in .game_loop, as the gate that
#              mattered. A `Build zonai` step now exists; the claim below is
#              only true because of it.
#              This job is the ONLY gate on tool/ci/e2e/*.dart: the local
#              .game_loop rule for that path is `dart analyze` and nothing
#              more, because compiling per fixture does not belong in a
#              per-commit gate. If this job is dropped, made non-blocking, or
#              loses its build step, that file goes back to having no real
#              check -- those are all one decision.
#   windows -- has never run. Path separators, line endings and process
#              spawning are the likely first failures. Windows is a release
#              target (zonai-windows-x64); a suite that has never run there is
#              the finding, so it is in the matrix rather than excluded.

# WHEN THIS RUNS, and why not on every push to main.
#
# This suite is expensive: the cli legs take 12-14 minutes, macOS bills at 10x
# and Windows at 2x, so a full run is a meaningful bite out of the monthly
# allowance. Running it on every main commit spent that on commits nobody was
# waiting for -- docs edits, handoff notes, a submodule pin bump.
#
#   pull_request   -- where changes actually arrive, and the only place a
#                     verdict changes what someone does next. GATED BY AUTHOR,
#                     see the `if:` on every job below.
#   workflow_run   -- the release chain. A release starts with a human
#                     dispatching Compile, so hanging Test off Compile means
#                     the suite runs for exactly the commit being released.
#   workflow_dispatch -- run it by hand against any ref when you want to.
#
# NOT push:main, deliberately. That trigger used to be the ONLY thing producing
# a Test run for a main commit, and tool/ci/check_release_gates.sh refuses to
# publish without a green Test for that EXACT sha. Removing it without the
# workflow_run line below would have made every release unpublishable, with the
# gate reporting "Test: no run for <sha>".
#
# VERIFIED before relying on it, not assumed: a workflow_run-triggered run
# reports the TRIGGERING run's head_sha, so the gate finds it. Measured against
# real runs -- Verify Release 31765112689 (workflow_run) and the Compile
# 31764664873 that triggered it both report head_sha ab56e63cdb03.
on:
  pull_request:
  workflow_run:
    workflows: [Compile]
    types: [completed]
  workflow_dispatch:

permissions:
  # `gh release download` for the native library cache, below.
  contents: read

concurrency:
  # Superseded PR runs are cancelled; a release-chain run is not, so every
  # commit being released keeps its own verdict.
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # MUST match compile.yml's and native-libs.yml's copies -- check_workflows.sh
  # asserts all three agree, and that this file is one of the four allowed to
  # declare it. A mismatch raises no error anywhere: the download step below
  # simply never finds the cache, `bootstrap test` rebuilds resqlite and
  # libsodium from C source on every runner, and the jobs stay green while
  # costing many times their budget.
  NATIVE_LIBS_CACHE_TAG: native-libs-cache

# WHO CAN SPEND THE ALLOWANCE. Every job below carries the same `if:`:
#
#   (pull_request AND the author is the repository owner)
#   OR (workflow_run AND the Compile that triggered it SUCCEEDED)
#   OR workflow_dispatch
#
# GitHub has no way to filter `on: pull_request` by author, so the filter has
# to be a job-level condition. A job whose `if` is false is SKIPPED, and a
# skipped job bills nothing -- an outside PR therefore costs a webhook and no
# minutes. It is repeated on each job rather than factored into one gate job
# other jobs `needs:`, so that no job can be added later that silently misses
# it by forgetting the dependency.
#
# WHAT THIS MEANS FOR CONTRIBUTORS, out loud: a pull request from anyone other
# than the owner runs NOTHING and reports no checks. That is the intent -- CI
# minutes are the owner's to spend -- but it means an outside PR arrives
# unverified, and reviewing one means running it yourself (workflow_dispatch on
# a branch, or pushing it to a branch you own). If this repo ever takes regular
# outside contributions, revisit this: the right shape then is usually
# `github.event.pull_request.head.repo.full_name == github.repository`, which
# runs for anyone who can push a branch here and skips forks.
#
# The workflow_run arm also checks the triggering run SUCCEEDED. `types:
# [completed]` fires on failure too, and running a 14-minute suite against a
# commit whose Compile just failed spends the budget to learn nothing.
#
# THE CEILING ON EVERY JOB BELOW, and why it is not one number.
#
# GitHub's default job timeout is 360 MINUTES. Nothing in this file overrode it,
# so a wedged job billed until someone noticed by hand -- and macOS bills at 10x,
# Windows at 2x. cli (macos-latest) did exactly that on 2026-08-14 (run
# 31839671048): its `CLI tests` step ran 15m03s without finishing, was cancelled
# by a human, and the runner killed three orphaned Dart child processes
# (dartaotruntime + 2 dartvm) at teardown. Unattended it would have billed ~3600
# minutes for one job.
#
# Each ceiling is set from a MEASURED duration on that run, not a guess, and
# every job is listed so a new one cannot inherit 360 by omission:
#
#   static 2.3m · docs 1.8m · unit 3.8m · submodules 3.0m   -> 10
#   e2e 8.0m (passing, ubuntu)                              -> 15
#   cli >18.6m ubuntu (cut off) / ~22.5m windows            -> 35
#
# `cli` moved 20 -> 35 on 2026-08-17 when the OAuth merge took the suite from
# 677 to 818 tests; the reasoning, and the evidence that it is growth and not a
# hang, is on the ceiling itself rather than repeated here.
#
# A ceiling is a BUDGET STOP, not a performance target. It bounds what a hang
# COSTS; it does not diagnose one, and it cannot tell a hang from a slow runner.
# Set too tight it manufactures a red that reads as a product regression -- which
# is why cli and e2e are not 10. When a job starts timing out, read the step
# durations before raising the number: the 15m03s above was a real defect, not a
# tight budget, and raising the ceiling would have hidden it.
jobs:
  # L0 -- compiles, formats, and the shell embedded in scripts.yaml/workflows.
  #
  # BLOCKING, and now green rather than green-by-luck. It stays one job rather
  # than splitting format (or the analyze) into a non-blocking sibling: a
  # non-blocking job is the one nobody ever flips, and splitting would mean
  # defining "static minus X" here, which is the second definition this file
  # exists to avoid.
  #
  # The only step below that this job owes `test static` is the root
  # `dart pub get`. The per-package resolves the analyze needs live in
  # scripts.yaml, deliberately, so `sip run test static` means the same thing
  # on a laptop and on this runner -- which is the whole point, since the
  # laptop/runner divergence is exactly what hid the 226 errors.
  static:
    name: static
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # budget stop -- see the ceiling note above `jobs:`
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is
          # private. The root pubspec is a workspace over libs/**, so a
          # checkout without submodules cannot even `dart pub get`.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout
        run: bash tool/setup_raindrop_submodule.sh

      - name: Pin PUB_CACHE
        shell: bash
        # Dart's default cache is ~/.pub-cache on Unix but
        # %LOCALAPPDATA%\Pub\Cache on Windows, so a single `~/.pub-cache` cache
        # path silently caches nothing on the Windows legs. Pinning it makes
        # one path correct everywhere.
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          # use_revali_git_overrides.sh pins the revali git refs, so a change
          # to it invalidates a resolution the lock file alone would not.
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        # Temporary: install from GitHub until a pub.dev release is pinned.
        # Mirrors compile.yml.
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Download pre-built native libraries (cache release)
        id: download-native-libs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="native-libs-linux-x64.tar.gz"
          mkdir -p apps/zonai/lib/gen/native
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"

      - name: Check downloaded native libraries
        id: native-libs
        shell: bash
        run: |
          if [ "${{ steps.download-native-libs.outcome }}" = "success" ] && \
             [ -n "$(ls -A apps/zonai/lib/gen/native 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No native-libs-linux-x64.tar.gz in the ${NATIVE_LIBS_CACHE_TAG} release -- building resqlite/Argon2 from source. Run the 'Native Libraries' workflow once to populate the cache."
          fi

      # Only on the cache-miss path. When the pre-built native libraries
      # download above succeeds, the build runs with
      # ZONAI_SKIP_NATIVE_BUILD=true and never compiles libsodium -- so
      # autoconf/automake/libtool/m4 would be installed for a build that does
      # not happen. That is not merely wasteful: on 2026-08-19 `apt-get ... -qq`
      # hung silently on ubuntu-latest x64 twice in twenty minutes (runs
      # 32294577535 and 32296487810), printing nothing at all because -qq
      # suppresses everything but errors and there were none. The first one held
      # Compile -- and with it Test, Verify Release and the entire release chain
      # -- for 18 minutes before a human killed it. Nothing that ran afterwards
      # used the packages it was waiting on.
      #
      # argon2.gen compiles libsodium via an autoconf/make build (see
      # tool/native/argon2_builder); confirmed via a bare `dart:stable`
      # container that build-essential alone isn't enough -- it also
      # needs autoconf/automake/libtool/m4. ubuntu-latest may already
      # have these, but installing explicitly removes the ambiguity
      # rather than hoping the runner image includes them.
      - name: Install native build toolchain (Linux)
        if: runner.os == 'Linux' && steps.native-libs.outputs.found != 'true'
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          for tool in gcc make autoconf automake libtool m4 pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      - name: Bootstrap lib/gen
        shell: bash
        env:
          ZONAI_SKIP_NATIVE_BUILD: ${{ steps.native-libs.outputs.found }}
        run: dart pub global run sip_cli:sip run bootstrap test

      # `bootstrap test` deliberately skips the web build, so lib/gen/web stays
      # absent after it -- and apps/web/lib/server/render_web_app.dart imports
      # `package:zonai/gen/web/web_assets.dart`. That was the 1 codegen error
      # bootstrap alone did not clear. `--stub` writes exactly the two symbols
      # that file uses (`lookupJasprWebAsset`, `JasprWebAsset`) with no jaspr
      # build, which is all an analyze needs; a real `web.gen` would spend
      # minutes producing asset bytes this job never reads.
      - name: Generate web asset stub
        run: cd apps/zonai && dart run tool/generate_web_assets.dart --stub

      - name: Static checks
        # `dart pub global run` rather than the `sip` stub, so the Windows legs
        # of the other jobs work under Git Bash (global stubs are .bat-only).
        # Kept identical across jobs so the invocation is one thing to learn.
        run: dart pub global run sip_cli:sip run test static

  # L1 -- pure logic. Three platforms, because this is the cheapest place to
  # find out that Windows disagrees about a path separator.
  unit:
    name: unit (${{ matrix.os }})
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10   # budget stop -- see the ceiling note above `jobs:`
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_libs_artifact: native-libs-linux-x64
          - os: macos-latest
            native_libs_artifact: native-libs-macos-arm64
          - os: windows-latest
            native_libs_artifact: native-libs-windows-x64
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Pin PUB_CACHE
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Download pre-built native libraries (cache release)
        id: download-native-libs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${{ matrix.native_libs_artifact }}.tar.gz"
          mkdir -p apps/zonai/lib/gen/native
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          # Read through the shell: `D:\a\_temp` parses as a host:path remote
          # spec in GNU tar, and --force-local does not exist in the bsdtar
          # macOS ships. compile.yml carries the same line for the same reason.
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"

      - name: Check downloaded native libraries
        id: native-libs
        shell: bash
        run: |
          # Presence only. Whether these are the RIGHT bytes is decided by
          # native_build_stamp.dart's `check`, inside resqlite.gen/argon2.gen --
          # a stamp mismatch falls back to building from source.
          if [ "${{ steps.download-native-libs.outcome }}" = "success" ] && \
             [ -n "$(ls -A apps/zonai/lib/gen/native 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${{ matrix.native_libs_artifact }}.tar.gz in the ${NATIVE_LIBS_CACHE_TAG} release -- building resqlite/Argon2 from source. Run the 'Native Libraries' workflow once to populate the cache."
          fi

      # Only on the cache-miss path. When the pre-built native libraries
      # download above succeeds, the build runs with
      # ZONAI_SKIP_NATIVE_BUILD=true and never compiles libsodium -- so
      # autoconf/automake/libtool/m4 would be installed for a build that does
      # not happen. That is not merely wasteful: on 2026-08-19 `apt-get ... -qq`
      # hung silently on ubuntu-latest x64 twice in twenty minutes (runs
      # 32294577535 and 32296487810), printing nothing at all because -qq
      # suppresses everything but errors and there were none. The first one held
      # Compile -- and with it Test, Verify Release and the entire release chain
      # -- for 18 minutes before a human killed it. Nothing that ran afterwards
      # used the packages it was waiting on.
      #
      # argon2.gen compiles libsodium via an autoconf/make build (see
      # tool/native/argon2_builder); confirmed via a bare `dart:stable`
      # container that build-essential alone isn't enough -- it also
      # needs autoconf/automake/libtool/m4. ubuntu-latest may already
      # have these, but installing explicitly removes the ambiguity
      # rather than hoping the runner image includes them.
      - name: Install native build toolchain (Linux)
        if: runner.os == 'Linux' && steps.native-libs.outputs.found != 'true'
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          for tool in gcc make autoconf automake libtool m4 pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      - name: Bootstrap lib/gen
        shell: bash
        env:
          ZONAI_SKIP_NATIVE_BUILD: ${{ steps.native-libs.outputs.found }}
        # MEASURED 2026-08-14, and it contradicts `test unit`'s own description
        # ("pure logic, no native build required"): with apps/zonai/lib/gen
        # moved aside, `cd apps/server && dart test` fails 2 and `cd apps/web &&
        # dart test` fails 1, because both import `package:zonai/...` and
        # apps/zonai imports lib/gen (version.dart, gen/native/*.g.dart,
        # gen/server). Restoring version.dart alone is not enough -- still 1
        # failure in each. So `test unit` carries the same undeclared
        # prerequisite `test cli` declares, and the description is stale.
        # Filed rather than fixed here: scripts.yaml belongs to another change.
        #
        # Each consuming job bootstraps for itself rather than one bootstrap job
        # publishing lib/gen as an artifact: artifact round-trips drop file
        # modes (compile.yml records this, which is why it tars) and would need
        # include-hidden-files for gen/server/.revali. With the cache release
        # hit, the native build is skipped and this is cheap; the artifact
        # version buys minutes at the price of a new way to be mysteriously red.
        run: dart pub global run sip_cli:sip run bootstrap test

      - name: Unit tests
        shell: bash
        run: dart pub global run sip_cli:sip run test unit

  # L1, but separate from `unit` because a skip here reports as a pass.
  #
  # apps/docs' anchor test calls markTestSkipped when build/jaspr is absent, so
  # a runner that does not build jaspr first gets `+18 ~1: All other tests
  # passed!` and exit 0 -- green by not running. `sip run test docs` builds
  # first (docs.build), which is why this is its own job rather than a line in
  # `unit`, and why the guard step below exists. Measured bare in this worktree
  # 2026-08-14: 18 passed, 1 skipped, exit 0.
  #
  # No bootstrap: apps/docs depends on jaspr only, not on package:zonai.
  # deploy-docs.yml already builds and tests it on CI without one.
  docs:
    name: docs
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # budget stop -- see the ceiling note above `jobs:`
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout
        run: bash tool/setup_raindrop_submodule.sh

      - name: Pin PUB_CACHE
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Docs tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          dart pub global run sip_cli:sip run test docs 2>&1 | tee test-logs/docs.log

      - name: Fail if apps/docs skipped its anchor test
        shell: bash
        # The whole reason this job exists. `dart test` exits 0 on a skip, so
        # the step above cannot tell "the anchor test checked the built HTML"
        # from "the anchor test found no build and reported nothing".
        #
        # THE PRIMARY CHECK IS THE DIRECTORY, not the log. search_index_test.dart
        # :138-142 skips on exactly one condition -- `Directory('build/jaspr')`
        # not existing -- so its presence is direct, reporter-independent proof
        # that the skip branch was not taken. Everything below it is a
        # belt-and-braces grep that can go blind without warning.
        #
        # A PREVIOUS VERSION OF THIS STEP GREPPED FOR 'All tests passed!' AND
        # COULD NEVER PASS. `sip` filters dart test's output and prints its own
        # summary ("19 tests passed."), so that string appears zero times in a
        # FULLY GREEN run -- which is what failed this job on 2026-08-14 (run
        # 31830243531) with all 19 tests passing. That grep is deleted rather
        # than corrected: it only duplicated the exit code, which `set -o
        # pipefail` in the step above already propagates from sip.
        #
        # The skip grep below is kept but must match BOTH reporters, because
        # `sip` is installed from --git-ref main with no pin and its output
        # shape can change under us at any time. It is deliberately narrow: the
        # jaspr builder prints its own unrelated "N skipped" lines into this
        # same log, so a broad grep for "skipped" is a false positive waiting
        # to happen.
        run: |
          if [ ! -d apps/docs/build/jaspr ]; then
            echo "::error::apps/docs/build/jaspr does not exist, so search_index_test's anchor test called markTestSkipped and the built HTML was never checked. sip run test docs is supposed to build it first -- see scripts.yaml docs.build."
            exit 1
          fi
          if grep -qE '[0-9]+ skipped tests?\.' test-logs/docs.log; then
            echo "::error::apps/docs reported a skipped test (dart test reporter). A skip here is not a pass. Read the docs-test-log artifact."
            exit 1
          fi
          if grep -qE 'Skipped:' test-logs/docs.log; then
            echo "::error::apps/docs reported a skipped test (sip reporter). A skip here is not a pass. Read the docs-test-log artifact."
            exit 1
          fi

      - name: Upload docs test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-test-log
          retention-days: 10
          path: test-logs/
          if-no-files-found: warn

  # L2+L3 -- the CLI's own suite, including its compiled-binary e2e tests.
  # 504 tests, and the reason this workflow exists.
  cli:
    name: cli (${{ matrix.os }})
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # 35 rather than the 10 the short jobs take: MEASURED 11.6m (ubuntu) / 14.0m (windows) completing normally on run
    # 31839671048, so a 10-minute ceiling would convert "503 passed, 4 failed"
    # into a contentless timeout and still bill the 10 minutes.
    #
    # RAISED from 20 on 2026-08-17, for v0.8.0. Both legs hit exactly 20m15s on
    # run 31986457034 -- `CLI tests` alone ran 18m37s on ubuntu and was cut off
    # mid-suite, so its true duration is unknown and >18.6m.
    #
    # The note above `jobs:` says to read the step durations before raising a
    # ceiling, because the 15m03s that produced this rule was a real defect and
    # raising the number would have hidden it. Read them, and this one is
    # growth, not a hang:
    #
    #   * the suite went 677 -> 818 tests when the OAuth campaign merged, and
    #     OAuth's share is disproportionately the slow kind (compiled-binary
    #     e2e legs, not unit tests);
    #   * it COMPLETES locally on the same commit -- 818 passed in 4m09s, up
    #     from 2m50s for 677. A wedged test would wedge on a laptop too;
    #   * only `cli` is near its ceiling. On the same run e2e took 6.3m/5.5m
    #     against 15, unit 3.2m/3.0m against 10, static 2.2m and docs 1.8m
    #     against 10. A hang would not be this selective.
    #
    # 35 and not 25: ubuntu is only bounded below (>18.6m), and windows has run
    # 1.21x ubuntu every time it was measured, which puts it near 22.5m. A
    # ceiling under ~30 would be re-litigating this in a month. It is still a
    # budget stop -- a wedged windows leg bills 70 minutes at 2x rather than the
    # 720 that GitHub's 360-minute default would.
    #
    # RE-MEASURE from the first green run and tighten this: the number above is
    # an extrapolation for windows and a lower bound for ubuntu, which is the
    # weakest kind of evidence this comment block has ever carried.
    #
    # RE-MEASURED, and RAISED from 35 on 2026-08-25, for v0.8.4. The
    # extrapolation was good and the ceiling was nearly reached anyway:
    #
    #   run 32310153095 / 32326305981 / 32337936988 (2026-08-19..20, v0.8.3):
    #     windows 29m, ubuntu 25m -- all three runs, both legs, identical.
    #   run 32796694121 (2026-08-25, this batch):
    #     windows 34m15s, ubuntu 28m49s.
    #
    # So the 1.21x windows:ubuntu ratio held exactly (28m49s x 1.21 = 34.9),
    # and one release cycle of e2e fixtures added ~5m to the windows leg --
    # leaving **45 seconds** of headroom under 35. That is not a ceiling any
    # more, it is a coin flip, and the coin decides whether a release chain
    # completes or throws away 40 minutes on a contentless timeout.
    #
    # 45 and not 40: 40 buys back only the headroom v0.8.3 already had, and
    # this leg has now grown twice for the same reason (see
    # `project_ci_cli_leg_grows_by_wallclock`). 45 is ~30% over the measured
    # 34m15s, which survives another batch of this size. Still a budget stop:
    # a wedged windows leg bills 90 minutes at 2x, against GitHub's 720.
    #
    # This is growth, not a hang, by the same three tests the 2026-08-17 note
    # applies: ubuntu grew in step (25 -> 28m49s, the same ~15%), the suite
    # completes locally on the same commit (9m27s for 1122 tests), and no
    # other leg is near its ceiling -- e2e, unit, docs and static all still
    # finish in single digits against 10-18.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_libs_artifact: native-libs-linux-x64
          # TEMPORARILY REMOVED -- macos-latest, 2026-08-14. NOT because the
          # suite fails there: every test file that reported on macOS gave
          # results IDENTICAL to ubuntu's. It is removed because `CLI tests`
          # HANGS -- 15m03s without finishing on run 31839671048 while ubuntu
          # did the same work in ~10m, three trivial unit files never scheduled
          # at all, and three orphaned Dart child processes (dartaotruntime +
          # 2 dartvm) killed at teardown. macOS bills at 10x, so each repeat
          # costs the full ceiling above and buys no new information.
          #
          # THE HANG IS UNDIAGNOSED. The specific test is NOT identified -- the
          # obvious suspect, migrate_auto_watch_test, already carries a 3-minute
          # Timeout plus 30/60/90s inner guards and so should fail rather than
          # hang. Probably the same fragility as the `test-load-fragility` leaf,
          # which records these suites aborting under load on a laptop.
          #
          # RESTORE THIS LEG once the hang is understood. Leaving it out is a
          # COST decision, not a verdict -- and while it is absent, macOS is a
          # release target (zonai-macos-arm64) whose CLI suite nothing checks.
          # - os: macos-latest
          #   native_libs_artifact: native-libs-macos-arm64
          - os: windows-latest
            native_libs_artifact: native-libs-windows-x64
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Pin PUB_CACHE
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Download pre-built native libraries (cache release)
        id: download-native-libs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${{ matrix.native_libs_artifact }}.tar.gz"
          mkdir -p apps/zonai/lib/gen/native
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"

      - name: Check downloaded native libraries
        id: native-libs
        shell: bash
        run: |
          if [ "${{ steps.download-native-libs.outcome }}" = "success" ] && \
             [ -n "$(ls -A apps/zonai/lib/gen/native 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${{ matrix.native_libs_artifact }}.tar.gz in the ${NATIVE_LIBS_CACHE_TAG} release -- building resqlite/Argon2 from source."
          fi

      # Only on the cache-miss path. When the pre-built native libraries
      # download above succeeds, the build runs with
      # ZONAI_SKIP_NATIVE_BUILD=true and never compiles libsodium -- so
      # autoconf/automake/libtool/m4 would be installed for a build that does
      # not happen. That is not merely wasteful: on 2026-08-19 `apt-get ... -qq`
      # hung silently on ubuntu-latest x64 twice in twenty minutes (runs
      # 32294577535 and 32296487810), printing nothing at all because -qq
      # suppresses everything but errors and there were none. The first one held
      # Compile -- and with it Test, Verify Release and the entire release chain
      # -- for 18 minutes before a human killed it. Nothing that ran afterwards
      # used the packages it was waiting on.
      #
      # argon2.gen compiles libsodium via an autoconf/make build (see
      # tool/native/argon2_builder); confirmed via a bare `dart:stable`
      # container that build-essential alone isn't enough -- it also
      # needs autoconf/automake/libtool/m4. ubuntu-latest may already
      # have these, but installing explicitly removes the ambiguity
      # rather than hoping the runner image includes them.
      - name: Install native build toolchain (Linux)
        if: runner.os == 'Linux' && steps.native-libs.outputs.found != 'true'
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          for tool in gcc make autoconf automake libtool m4 pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      - name: Bootstrap lib/gen
        shell: bash
        env:
          ZONAI_SKIP_NATIVE_BUILD: ${{ steps.native-libs.outputs.found }}
        # scripts.yaml's `test cli` deliberately does NOT run this for you, so
        # that a missing lib/gen fails loudly instead of the suite passing
        # against a stale one. That means the job owes it.
        run: dart pub global run sip_cli:sip run bootstrap test

      - name: CLI tests
        shell: bash
        run: dart pub global run sip_cli:sip run test cli

  # L3 -- drives the e2e/ fixture projects through a real compiled binary.
  #
  # tool/ci/run_e2e.sh landed in bdaa61d, so `test e2e` no longer exits 70 --
  # this job now does the thing it was wired in advance to do
  # (docs/testing-strategy.md Step 3). It found a live product bug on its first
  # run: 21 of 24 concurrent creates answering HTTP 500 from the rate limiter,
  # fixed in 4beb750 and now asserted here rather than reported.
  #
  # This is the ONLY real gate on tool/ci/e2e/*.dart. The local .game_loop rule
  # for that path runs `dart analyze` and nothing else, deliberately -- and an
  # assertion that cannot pass analyzes perfectly clean, which is exactly the
  # bug the second Crawler on that file found in the first one's work. So
  # deleting this job, or making it non-blocking, silently removes the check on
  # the code that checks everything else.
  #
  # Bootstrap here is the floor, not a claim of sufficiency: run_e2e.sh needs a
  # compiled binary, and a compile needs lib/gen. Whatever else it needs
  # (web assets, fixture setup) it must state and satisfy itself -- that rule
  # is why `test cli` and `test submodules` are separate targets at all.
  e2e:
    name: e2e (${{ matrix.os }})
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # 18 rather than the 10 the short jobs take: MEASURED 8.0m (ubuntu, passing) on run 31839671048 with FOUR served
    # fixtures, and its dominant step is an AOT compile whose duration is
    # variable -- 10 would be a coin flip and a timeout here would read as a
    # product regression rather than a budget cut.
    #
    # Raised from 15 with `forced_password_reset`, the fifth served fixture.
    # Each fixture pays its own `zonai compile` and then runs twice (process
    # and isolate), so the honest estimate is 8.0m x 5/4 = ~10m, and 15 would
    # have left this job thinner headroom than the measurement it was set
    # from. Measured locally at 16.5s for the new fixture's whole lifecycle,
    # both transports included -- but a loaded dev machine is not a runner,
    # which is exactly why the ceiling moves with the fixture count rather
    # than with that number.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_libs_artifact: native-libs-linux-x64
          - os: macos-latest
            native_libs_artifact: native-libs-macos-arm64
          - os: windows-latest
            native_libs_artifact: native-libs-windows-x64
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Pin PUB_CACHE
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Download pre-built native libraries (cache release)
        id: download-native-libs
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${{ matrix.native_libs_artifact }}.tar.gz"
          mkdir -p apps/zonai/lib/gen/native
          gh release download "${NATIVE_LIBS_CACHE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          tar -xzf - -C apps/zonai/lib/gen/native < "${RUNNER_TEMP}/${archive}"

      - name: Check downloaded native libraries
        id: native-libs
        shell: bash
        run: |
          if [ "${{ steps.download-native-libs.outcome }}" = "success" ] && \
             [ -n "$(ls -A apps/zonai/lib/gen/native 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${{ matrix.native_libs_artifact }}.tar.gz in the ${NATIVE_LIBS_CACHE_TAG} release -- building resqlite/Argon2 from source."
          fi

      # Only on the cache-miss path. When the pre-built native libraries
      # download above succeeds, the build runs with
      # ZONAI_SKIP_NATIVE_BUILD=true and never compiles libsodium -- so
      # autoconf/automake/libtool/m4 would be installed for a build that does
      # not happen. That is not merely wasteful: on 2026-08-19 `apt-get ... -qq`
      # hung silently on ubuntu-latest x64 twice in twenty minutes (runs
      # 32294577535 and 32296487810), printing nothing at all because -qq
      # suppresses everything but errors and there were none. The first one held
      # Compile -- and with it Test, Verify Release and the entire release chain
      # -- for 18 minutes before a human killed it. Nothing that ran afterwards
      # used the packages it was waiting on.
      #
      # argon2.gen compiles libsodium via an autoconf/make build (see
      # tool/native/argon2_builder); confirmed via a bare `dart:stable`
      # container that build-essential alone isn't enough -- it also
      # needs autoconf/automake/libtool/m4. ubuntu-latest may already
      # have these, but installing explicitly removes the ambiguity
      # rather than hoping the runner image includes them.
      - name: Install native build toolchain (Linux)
        if: runner.os == 'Linux' && steps.native-libs.outputs.found != 'true'
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          for tool in gcc make autoconf automake libtool m4 pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool m4 pkg-config

      # NO `bootstrap test` STEP HERE, deliberately -- unlike unit and cli.
      # `zonai compile` below is a SUPERSET of it (scripts.yaml: bootstrap test
      # is version.gen + resqlite.gen + argon2.gen + server.copy-to-cli; zonai
      # compile is all four plus raindrop.vendor, web.gen and the AOT build),
      # which is why compile.yml has never carried one either.
      #
      # It was here, and it broke the macOS leg. Running both meant invoking
      # revali codegen TWICE, and on the macOS runner the SECOND invocation
      # fails where the first succeeds -- 2/2 across runs 31839671048 and
      # 31842392052, Bootstrap green and Build zonai red on the same runner,
      # same SDK, same revali pin, same source. ubuntu and windows run the
      # identical two-invocation sequence and pass both, and run 31830243531
      # (one invocation) passed codegen on macOS. So the trigger is the second
      # invocation on that runner, not the platform and not the source.
      #
      # The underlying fragility is upstream and still live -- revali 3.2.0
      # lib/server/utils/annotation_argument.dart:35-41 reads
      # expression.staticType off an AST it does not always get resolved. See
      # docs/revali-dot-shorthand-codegen.md. Dropping the redundant invocation
      # removes this job's exposure to it; it does not fix it.

      # THIS JOB RAN ZERO E2E TESTS UNTIL THIS STEP EXISTED. `run_e2e.sh` drives
      # a REAL compiled binary and looks for one at build/zonai (build/zonai.exe
      # on Windows, tool/ci/run_e2e.sh:125-143). Nothing here produced it, so on
      # the first real CI run (2026-08-14, run 31830243531) all three legs exited
      # 70 on `no compiled zonai binary at .../build/zonai` before a single
      # assertion ran -- while test.yml's own comments, and the local
      # .game_loop rule for tool/ci/e2e/**, both recorded this job as "the gate
      # that matters" for the e2e driver. It gated nothing.
      #
      # Same invocation compile.yml uses to produce the release binary, so there
      # is one way to build zonai on CI rather than two that can drift. It is
      # also the expensive step in this job by a wide margin.
      - name: Build zonai
        shell: bash
        env:
          ZONAI_SKIP_NATIVE_BUILD: ${{ steps.native-libs.outputs.found }}
        run: dart pub global run sip_cli:sip run zonai compile

      - name: E2E tests
        shell: bash
        run: dart pub global run sip_cli:sip run test e2e

  # Prerequisite-carrying suites, kept out of `unit` on purpose. libs/resqlite
  # needs its own native build into its own .dart_tool/lib -- NOT the
  # apps/zonai path the cache release fills, which is why this job does not
  # restore it and builds from source instead.
  #
  # EXPECTED RED: libs/resqlite was measured at 55/172 on trunk, 117 failures
  # from an undeclared prerequisite inside its own suite. `test submodules`
  # now satisfies that prerequisite; whether it clears all 117 is what this
  # job is here to find out. libs/raindrop was measured at 901 passing across
  # its 5 packages (2026-08-27: raindrop 320, raindrop_sqlite 254,
  # raindrop_postgres 82, raindrop_test 64, raindrop_cli 181 -- the last
  # includes the migration harness under packages/raindrop_cli/test/migrations,
  # which the sparse checkout above does pull in: its pattern is '/*' plus
  # '/packages/').
  #
  # ubuntu only, for now: it is the platform the submodules are developed on,
  # and adding the other two before this one is green would just be three
  # copies of the same unread failure.
  submodules:
    name: submodules
    # See "WHO CAN SPEND THE ALLOWANCE" above `jobs:`. A false `if` SKIPS the
    # job, which bills nothing.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # budget stop -- see the ceiling note above `jobs:`
    steps:
      - name: Checkout zonai
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout
        run: bash tool/setup_raindrop_submodule.sh

      - name: Pin PUB_CACHE
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/ci/use_revali_git_overrides.sh') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Configure revali git overrides
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Install sip
        run: dart pub global activate --source git https://github.com/mrgnhnt96/sip.git --git-ref main

      - name: Get dependencies
        run: dart pub get

      - name: Install native build toolchain (Linux)
        # resqlite's own build, below, compiles SQLite from C source.
        # Genuinely needed here -- this job has no pre-built-native-libraries
        # path to fall back on, so the toolchain is used rather than merely
        # installed. Still bounded: see compile.yml for the silent apt hang
        # that made an unbounded step cost 18 minutes of a release chain.
        timeout-minutes: 5
        run: |
          # Ask before installing. `apt-get ... -qq` hung silently on
          # ubuntu-latest three times on 2026-08-19 (18min, 1min, 5min --
          # printing nothing at all, because -qq suppresses everything but
          # errors and there were none), and the ubuntu image already ships
          # this toolchain. When every tool is on PATH there is nothing to
          # install and the hang cannot reach us; apt still runs, bounded,
          # when something is genuinely missing. The check names what it
          # found either way, so a future image dropping a package shows up
          # as a log line rather than as a mystery.
          missing=""
          # THIS JOB ONLY NEEDS A C COMPILER. It runs
          # `resqlite/tool/build_native.dart`, which drives
          # package:native_toolchain_c (CBuilder) -- the compiler directly,
          # with no autoconf/automake/libtool/m4 anywhere in it. The longer
          # list belongs to the jobs that build libsodium through autoconf,
          # and was copied here with it. That cost a release cycle on
          # 2026-08-19: the probe reported `missing: libtool`, apt went out
          # to fetch a package nothing in this job would have used, and hung
          # -- the fourth silent apt hang of the day.
          for tool in gcc make; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -z "${missing}" ]; then
            echo "native build toolchain already present -- not calling apt"
            exit 0
          fi
          echo "missing:${missing} -- installing via apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Submodule tests
        shell: bash
        run: dart pub global run sip_cli:sip run test submodules

  # THE FORMER `Verify Release` WORKFLOW, now a job in this one -- five
  # platforms of `zonai` artifact checks, `zonai build` on a real-shaped
  # project, the macOS->linux cross-target pair and the upgrade compat matrix.
  # Its bodies did not move; see verify-release.yml.
  #
  # WHY IT MOVED HERE. It used to hang off `workflow_run: [Compile]` beside this
  # workflow, so the release chain had TWO prerequisite workflows finishing at
  # unpredictable times. release.yml has to wait for both, a `workflow_run`
  # trigger cannot express "whichever finishes last", so Release was fired by
  # both -- and the earlier attempt was refused as "the other one is still
  # running", producing one red Release run per release BY DESIGN. That red was
  # documented as noise, which is the state a real red run has to compete with.
  # One prerequisite workflow means one trigger, one attempt, and a red Release
  # run that always means something.
  #
  # WALL CLOCK IS UNCHANGED. These are still separate jobs on separate runners
  # running concurrently with `cli`/`e2e`/`unit` above, and the verify legs
  # (~5 min) finish long inside `cli` (~26 min). What merged is the VERDICT,
  # not the schedule.
  #
  # THE `if:` IS THE SAME ALLOWANCE FILTER as every job above, minus the
  # pull_request arm: these jobs consume Compile artifacts, and a pull request
  # has no Compile run to consume. An owner PR skips this and runs the rest.
  #
  # `permissions:` is not inherited -- a called workflow is capped by the grant
  # on the calling job, and this file's top-level grant is `contents: read`
  # alone. Without `actions: read` here every artifact download inside fails.
  verify-release:
    name: verify-release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-release.yml
    with:
      # The Compile run that triggered THIS run, so the artifacts verified are
      # the ones that commit produced. Empty on a workflow_dispatch, where the
      # callee falls back to the newest successful Compile for `github.sha`.
      compile_run_id: ${{ github.event.workflow_run.id }}
    # SUBMODULES_PAT, for the private raindrop submodule the verify jobs check
    # out. GITHUB_TOKEN cannot read it.
    secrets: inherit
