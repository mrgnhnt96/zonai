name: Verify Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Compile]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: ${{ matrix.artifact_name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zonai-linux-x64
            executable_name: zonai
          - os: ubuntu-24.04-arm
            artifact_name: zonai-linux-arm64
            executable_name: zonai
          - os: macos-latest
            artifact_name: zonai-macos-arm64
            executable_name: zonai
          - os: macos-15-intel
            artifact_name: zonai-macos-x64
            executable_name: zonai
          - os: windows-latest
            artifact_name: zonai-windows-x64
            executable_name: zonai.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is private.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Download release version files (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: release-version

      # Every `workflow_dispatch` download in this file is pinned to
      # `github.sha`, and this is the first of eight. The `workflow_run` paths
      # are already safe because they pin `run_id` to the triggering compile;
      # only the hand-triggered ones asked for "the newest successful Compile"
      # and would take it from any commit, however old.
      #
      # That asymmetry is not cosmetic. This workflow is the release gate, and
      # a gate that validates a different commit's binaries reports success
      # about something nobody is shipping -- worse than no gate, because it
      # is believed. release.yml had the identical bug and published v0.6.3
      # from six-day-old artifacts.
      #
      # `if_no_artifact_found: fail` is the other half: without it a missing
      # artifact is only a warning and the job continues against whatever
      # happens to be in the workspace. Run Compile on the ref, then dispatch.
      - name: Download release version files (this commit)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: release-version

      - name: Download artifact (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact_name }}
          path: build

      - name: Download artifact (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: ${{ matrix.artifact_name }}
          path: build

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Get dependencies
        run: dart pub get

      - name: Verify release artifact
        shell: bash
        run: bash tool/ci/verify_release_artifact.sh "build/${{ matrix.executable_name }}"

  # `verify` drives compile/serve against apps/playground, which carries a
  # `zonai: {path: ...}` dev dependency -- a shape no real project has, since
  # zonai ships as a standalone binary. It also never runs `build`. Between
  # v0.5 and v0.6 `zonai build` was broken for every project *without* that
  # dependency and CI stayed green throughout. This job is that gap: the real
  # command, a real-shaped project, and the bundle actually serving.
  build-command:
    name: build-${{ matrix.artifact_name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zonai-linux-x64
            executable_name: zonai
            target: linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: zonai-linux-arm64
            executable_name: zonai
            target: linux-arm64
          - os: macos-latest
            artifact_name: zonai-macos-arm64
            executable_name: zonai
            target: macos-arm64
          - os: macos-15-intel
            artifact_name: zonai-macos-x64
            executable_name: zonai
            target: macos-x64
          - os: windows-latest
            artifact_name: zonai-windows-x64
            executable_name: zonai.exe
            target: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot read private submodule repos; raindrop is private.
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Download release version files (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: release-version

      - name: Download release version files (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: release-version

      - name: Download artifact (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact_name }}
          path: build

      - name: Download artifact (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: ${{ matrix.artifact_name }}
          path: build

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      # The fixture is not a workspace member, so the root overrides other
      # jobs write would never reach it -- pin it explicitly to the same ref
      # rather than let it resolve the revali family from pub.dev.
      - name: Configure revali git overrides
        shell: bash
        run: |
          bash tool/ci/use_revali_git_overrides.sh
          bash tool/ci/use_revali_git_overrides.sh e2e/build_smoke

      - name: Get dependencies
        run: dart pub get

      # `apps/zonai/lib/gen/native/*.g.dart` is gitignored and produced by
      # compile.yml, so a plain checkout does not have it. This job needs it
      # anyway, because `zonai build` links the smoke project against
      # apps/zonai's own sources (resolveProjectLink's merged package_config),
      # so the AOT compile reads those files directly. Without them all five
      # platforms fail with "Error when reading '.../argon2_native.g.dart'"
      # and "Undefined name 'resqliteNativeLibraryBytes'" -- observed on every
      # matrix leg of run 31748784749.
      #
      # `version.dart` is NOT generated here: the `release-version` artifact
      # already carries it (compile.yml uploads `VERSION` +
      # `apps/zonai/lib/gen/version.dart`), which is why the failure named only
      # the native bindings and never `kVersion`.
      #
      # Same shape as cross-target-build below, and pinned the same way -- the
      # libraries come from the compile run being verified, so what gets
      # embedded here is what that run embedded.
      - name: Download embedded native libraries (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: native-libs-embedded-${{ matrix.target }}
          path: apps/zonai/lib/gen/native

      - name: Download embedded native libraries (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: native-libs-embedded-${{ matrix.target }}
          path: apps/zonai/lib/gen/native

      # Formats the downloaded library bytes into the Dart constants the build
      # embeds. No C toolchain runs here -- these scripts only read the file
      # beside them and write the .g.dart, and they exit 1 if it is absent.
      - name: Generate embedded native library sources
        shell: bash
        working-directory: apps/zonai
        run: |
          dart run tool/generate_resqlite_native.dart
          dart run tool/generate_argon2_native.dart

      # The rest of lib/gen the linked build reads: revali's generated server
      # (imported by db_mutator/revali.dart) and the embedded web assets
      # (imported by apps/web's render_web_app.dart). Produced by `zonai
      # compile` in the run being verified rather than regenerated here, so
      # this exercises what that run actually built.
      - name: Download generated sources (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: zonai-gen-sources-${{ matrix.target }}
          path: apps/zonai/lib/gen

      - name: Download generated sources (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: zonai-gen-sources-${{ matrix.target }}
          path: apps/zonai/lib/gen

      # Names both files whose absence has already cost a run, so a partial
      # artifact fails here instead of inside an AOT compile: the hidden
      # `.revali/` entry, and the web assets that were wrongly judged unused.
      - name: Check the generated sources arrived
        shell: bash
        run: |
          status=0
          for entry in \
            "apps/zonai/lib/gen/server/.revali/server/server.dart" \
            "apps/zonai/lib/gen/web/web_assets.dart"; do
            if [[ -f "${entry}" ]]; then
              echo "ok: ${entry}"
            else
              echo "missing ${entry}" >&2
              status=1
            fi
          done
          if [[ "${status}" -ne 0 ]]; then
            echo "the zonai-gen-sources artifact was incomplete" >&2
            echo "(hidden files are one cause: .revali/ needs" >&2
            echo " include-hidden-files on the upload in compile.yml)" >&2
            exit 1
          fi

      - name: Verify the build command
        shell: bash
        run: bash tool/ci/verify_build_command.sh "build/${{ matrix.executable_name }}"

  # Every job above builds for the platform it is running on, so none of them
  # can see the failure that took a real deployment down: `dart compile exe
  # --target-os` cross-compiles the executable format but NOT the native
  # library bytes embedded as Dart constants, so a bundle built on macOS for
  # Linux ships Mach-O libraries inside every executable it contains. Whether
  # that bundle is deployable depends on `zonai build` fetching the target's
  # real libraries beside them -- which it did only on the project-linked
  # branch, i.e. never for a project shaped like a real one.
  #
  # The two halves cannot be one job. Building must happen on a host that is
  # not the target (macOS), running must happen on the target (Linux), and
  # GitHub's macOS runners have no container runtime to stand in for one.
  cross-target-build:
    name: cross-build-linux-x64
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Download release version files (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: release-version

      - name: Download release version files (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: release-version

      - name: Download artifact (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: zonai-macos-arm64
          path: build

      - name: Download artifact (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: zonai-macos-arm64
          path: build

      # The *host's* libraries, on purpose: the probe compiled below embeds
      # them and is then cross-compiled for Linux, which is exactly the shape
      # of every worker in the bundle and the only way to make a binary that
      # would install the wrong library if the guard let it.
      - name: Download embedded native libraries (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: native-libs-embedded-macos-arm64
          path: apps/zonai/lib/gen/native

      - name: Download embedded native libraries (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: native-libs-embedded-macos-arm64
          path: apps/zonai/lib/gen/native

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Configure revali git overrides
        shell: bash
        run: |
          bash tool/ci/use_revali_git_overrides.sh
          bash tool/ci/use_revali_git_overrides.sh e2e/build_smoke

      - name: Get dependencies
        run: dart pub get

      # Formats the downloaded .dylib bytes into the Dart constants the probe
      # embeds. No C toolchain runs here -- the libraries themselves were built
      # by compile.yml and are what this reads.
      - name: Generate embedded native library sources
        shell: bash
        working-directory: apps/zonai
        run: |
          dart run tool/generate_resqlite_native.dart
          dart run tool/generate_argon2_native.dart

      # zonai build reads GITHUB_TOKEN/GH_TOKEN for release downloads. The repo
      # is public, so this is not about access: an unauthenticated Actions
      # runner shares 60 API requests/hour per IP, and a 403 from that limit is
      # indistinguishable in the output from a release that does not exist.
      #
      # REQUIRE_NATIVE_LIBS is deliberately unset here. This runs before the
      # release that would publish this version's native-libs-*.zip, so the
      # fetch cannot succeed and its absence is expected rather than a failure
      # -- see the header of cross_target_build.sh, and the post-release job in
      # release.yml that does require them.
      - name: Build a linux/x64 bundle on macOS arm64
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tool/ci/cross_target_build.sh \
            build/zonai linux x64 e2e/build_smoke cross-target-out

      # include-hidden-files, because the entire bundle payload lives under
      # `.zonai/` -- the workers, the migrations, the libraries. Without it the
      # upload silently keeps only `zonai` and `zonai.yaml`, and the run half
      # receives a bundle with nothing in it to run.
      - name: Upload the cross-target bundle
        uses: actions/upload-artifact@v4
        with:
          name: cross-target-linux-x64
          retention-days: 10
          path: cross-target-out
          include-hidden-files: true
          if-no-files-found: error

  cross-target-run:
    name: cross-run-linux-x64
    needs: cross-target-build
    runs-on: ubuntu-latest

    steps:
      # No submodules and no PAT: this job runs a bundle that is already built
      # and needs nothing from the repo but the script that checks it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the cross-target bundle
        uses: actions/download-artifact@v4
        with:
          name: cross-target-linux-x64
          path: cross-target-out

      - name: Run the macOS-built bundle on linux/x64
        shell: bash
        run: |
          bash tool/ci/verify_cross_target_bundle.sh \
            cross-target-out/bundle \
            cross-target-out/native_library_probe \
            cross-target-out/VERSION

  compat-check:
    name: compat-${{ matrix.artifact_name }}
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zonai-linux-x64
            executable_name: zonai
          - os: ubuntu-24.04-arm
            artifact_name: zonai-linux-arm64
            executable_name: zonai
          - os: macos-latest
            artifact_name: zonai-macos-arm64
            executable_name: zonai
          - os: macos-15-intel
            artifact_name: zonai-macos-x64
            executable_name: zonai
          - os: windows-latest
            artifact_name: zonai-windows-x64
            executable_name: zonai.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          submodules: recursive

      - name: Configure raindrop sparse checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tool/setup_raindrop_submodule.sh

      - name: Configure raindrop sparse checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/setup_raindrop_submodule.ps1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Configure revali git overrides
        shell: bash
        run: bash tool/ci/use_revali_git_overrides.sh

      - name: Download new binary (triggering compile run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact_name }}
          path: build/new

      - name: Download new binary (latest successful compile)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          if_no_artifact_found: fail
          name: ${{ matrix.artifact_name }}
          path: build/new

      # Pinned to the newest CLI tag, not GitHub's "latest": a per-package
      # release (zonai_schema-v*, zonai_client-v*) takes that slot whenever one
      # is published after a CLI release, and those carry no binaries -- which
      # is exactly how this job started failing with "no assets to download"
      # on 2026-08-10 without anything about the compat check changing.
      - name: Download previous release binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/old
          tag="$(bash tool/ci/latest_cli_release_tag.sh)"
          if [[ -z "${tag}" ]]; then
            echo "no zonai CLI release (v<semver>) to compare against" >&2
            exit 1
          fi
          echo "Comparing against ${tag}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ matrix.artifact_name }}.zip" \
            --dir build/old/
          unzip -o "build/old/${{ matrix.artifact_name }}.zip" -d build/old/
          if [[ "${{ matrix.executable_name }}" != *.exe ]]; then
            chmod +x "build/old/${{ matrix.executable_name }}"
          fi

      - name: Run compatibility check
        shell: bash
        run: >-
          bash tool/ci/verify_compat.sh
          "build/old/${{ matrix.executable_name }}"
          "build/new/${{ matrix.executable_name }}"
