analyzer:
  exclude:
    # Compiled/tool output. Never hand-written, regenerated on every build.
    - "**/build/**"
    - "**/.dart_tool/**"
    # Checked-in generated code (vendored client SDKs, embedded server/web
    # assets, OpenAPI specs). Marked "GENERATED CODE - DO NOT MODIFY BY HAND"
    # at the files themselves; some entries are additionally gitignored.
    - "**/lib/gen/**"
    # Vendored forks of external OSS packages, not zonai's own code.
    - "libs/raindrop/**"
    - "libs/resqlite/**"
    # zonai_stress_fixture added a `path:` dependency on apps/zonai (which
    # declares `resolution: workspace`) in 87966a5, and `dart pub get` fails
    # here on a clean checkout, so every import in it is unresolved.
    #
    # The MEASURED reason (2026-08-14) is not the one previously recorded here
    # -- it is not that pub refuses a path dep on a workspace member. Pub gets
    # further than that and fails version solving on a transitive:
    #   "every version of zonai from path depends on raindrop_cli from path
    #    which depends on raindrop ^0.0.1 ... no versions of raindrop match
    #    ^0.0.1"
    # raindrop is satisfied inside the workspace by libs/raindrop's path entry
    # and is not on pub.dev, so nothing outside the workspace can resolve it.
    # Still a pre-existing pub-workspace-graph bug, still tracked separately
    # and not fixed here -- but a reader chasing the wrong mechanism will not
    # find it.
    #
    # THIS EXCLUDE IS LOAD-BEARING, contrary to a note that circulated saying
    # analyzer excludes cannot cross into a directory with its own pubspec.yaml
    # because it forms its own analysis context. Measured both ways on this
    # tree: deleting this one line takes `dart analyze .` from 288 to 329
    # issues, all 41 of them under stress/fixture. Excluding a nested package
    # from the ROOT options file works. (It is nonetheless the wrong tool for
    # e2e/* and stress/, which CAN resolve -- scripts.yaml `test static`
    # resolves those instead, so they are actually analysed rather than
    # silently skipped. See its comment.)
    - "stress/fixture/**"
