name: zonai_client
description: Generated HTTP client for the Zonai Revali server.
version: 0.1.2
repository: https://github.com/mrgnhnt96/zonai/tree/main/libs/zonai_client

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  file: ^7.0.1
  http: ^1.6.0
  revali_client: ^2.0.4
  # Spans both 0.1.x and 0.2.x on purpose. zonai_schema 0.2.0's breaking change
  # is `TableRateLimits.customPolicy`, which is server-side and which nothing
  # here references -- so a `^` pin would force consumers of this client onto
  # one schema minor for no reason of its own.
  zonai_schema: ">=0.1.0 <0.3.0"
