name: zonai_client
# Says Dart, Flutter, auth, SQLite and live streams because those are what someone
# types into pub.dev's search box. The old one-liner named Revali -- an internal
# dependency nobody outside this repo has heard of -- and came in under the 60
# characters pub.dev's scoring wants.
description: >-
  Typed Dart and Flutter client for a Zonai backend: auth, CRUD, file uploads,
  and live SQLite query streams over HTTP.
version: 0.1.3
repository: https://github.com/mrgnhnt96/zonai/tree/main/libs/zonai_client
homepage: https://zonai.dev
documentation: https://docs.zonai.dev/dart-client/overview
issue_tracker: https://github.com/mrgnhnt96/zonai/issues
topics:
  - backend
  - api-client
  - sqlite
  - streaming
  - auth

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  file: ^7.0.1
  http: ^1.6.0
  revali_client: ^3.0.0
  # Spans 0.1.x through 0.3.x on purpose. Every breaking change in those
  # minors has been server-side -- `TableRateLimits.customPolicy` in 0.2.0,
  # and 0.3.0's `revali_core` major plus new cron IPC vocabulary -- and this
  # package references none of it. A `^` pin would force consumers of this
  # client onto one schema minor for no reason of its own, and a constraint
  # that lags is worse than useless: it silently pins them *below* a schema
  # they explicitly asked for.
  zonai_schema: ">=0.1.0 <0.4.0"

dev_dependencies:
  analyzer: ">=8.0.0 <13.0.0"
  path: ^1.9.0
  test: ^1.26.2
