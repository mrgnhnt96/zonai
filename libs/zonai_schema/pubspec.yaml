name: zonai_schema
description: >
  Shared relational model for Zonai — Raindrop schemas, typed IDs, column
  helpers, and anything else clients and services need to agree on the DB shape.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  meta: ^1.17.0
  raindrop:
  raindrop_sqlite:
  scoped_deps:
    path: ../scoped_deps
