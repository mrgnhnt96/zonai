name: zonai_schema
description: >
  Shared relational model for Zonai — Raindrop schemas, typed IDs, column
  helpers, and anything else clients and services need to agree on the DB shape.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  revali_router_core: ^2.3.0
  cron: ^0.6.2
  crypto: ^3.0.7
  meta: ^1.17.0
  msgpack_dart: ^1.0.1
  raindrop:
    path: ../raindrop/packages/raindrop
  raindrop_sqlite:
    path: ../raindrop/packages/raindrop_sqlite
  scoped_deps: ^0.2.1

dev_dependencies:
  revali_router: ^3.4.0
  test: ^1.26.2
