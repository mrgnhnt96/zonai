name: zonai_schema
# Named Raindrop, which is a private dependency -- so the sentence pub.dev showed
# turned on a word no reader could resolve. This says what you author with it.
description: >-
  Define a Zonai backend in Dart: tables, access rules, rate limits, extensions
  and the wire types the server and its clients agree on.
version: 0.4.1
repository: https://github.com/mrgnhnt96/zonai/tree/main/libs/zonai_schema
homepage: https://zonai.dev
documentation: https://docs.zonai.dev/schemas/defining-tables
issue_tracker: https://github.com/mrgnhnt96/zonai/issues
topics:
  - backend
  - sqlite
  - schema
  - orm
  - server
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  revali_core: ^3.0.0
  clock: ^1.1.2
  cron: ^0.6.2
  crypto: ^3.0.7
  meta: ^1.17.0
  msgpack_dart: ^1.0.1
  scoped_deps: ^0.2.1

dev_dependencies:
  revali_router: ^5.1.1
  test: ^1.26.2
  # test/src/schemas/auth/oauth_mixin_compile_test.dart imports it. Resolving
  # inside this workspace it was satisfied transitively and nothing complained;
  # `dart pub publish` did, because a consumer running these tests from the
  # published archive has no workspace to borrow it from.
  path: ^1.9.0
  # Only used by SQLiteDelegate (gen/raindrop/raindrop_sqlite/src/sqlite_delegate.dart),
  # which this package's own tests use for fast in-memory SQLite testing. Never a
  # regular dependency: SQLiteDelegate isn't exported from zonai_schema.dart's public
  # barrel (the sub-barrel exports it, but the outer barrel's `show` clause excludes
  # it), so no consumer's code path can reach it. Keeping it a dev_dependency means
  # consumers (e.g. a Flutter client also using Drift, which pins sqlite3 ^3.0.0) never
  # have to resolve zonai_schema's <3.0.0 constraint at all. See issue #24.
  #
  # <3.0.0 because the vendored SQLiteDelegate calls the 2.x `dispose()` API.
  # See raindrop_sqlite/pubspec.yaml for why 3.x's `source: process` is not a
  # substitute for `open.overrideForAll`.
  sqlite3: ">=2.4.0 <3.0.0"
