name: zonai_schema
description: >
  Shared relational model for Zonai — Raindrop schemas, typed IDs, column
  helpers, and anything else clients and services need to agree on the DB shape.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  revali_core: ^1.6.0
  cron: ^0.6.2
  crypto: ^3.0.7
  meta: ^1.17.0
  msgpack_dart: ^1.0.1
  scoped_deps: ^0.2.1
  sqlite3: ">=2.4.0 <3.0.0"

dev_dependencies:
  revali_router: ^3.4.0
  test: ^1.26.2
